<meta name="apple-mobile-web-app-title" content="Maimine 管理頁">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 米白底、鼠尾草綠、淺綠灰、墨黑；管理頁「設定」裡可以換 */
  --paper:#F0EFEA; --sage:#A2AA93; --pill:#D4D6C8; --ink:#161616;
  --okbg:#E3EBD9; --ok:#4F6B3A; --warnbg:#F6EAD3; --warn:#9A6514; --red:#A8483A; --muted:#6B6E66;
  --cang:#E2CDA8; --cang-ink:#6B4F2A; --rest:#E3C4C4; --rest-ink:#7A4545;
  --body:"Nunito","Chiron GoRound TC","PingFang TC",system-ui,sans-serif;
  color-scheme:light;
}
:root{
  --chip:color-mix(in srgb,var(--pill) 50%,var(--paper));
  --field:color-mix(in srgb,#fff 55%,var(--paper));
  --edge:color-mix(in srgb,var(--pill) 82%,var(--ink));
  --deep:color-mix(in srgb,var(--sage) 58%,var(--ink));
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 80px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--deep);outline-offset:2px}
.head{position:sticky;top:0;z-index:6;background:var(--paper);padding:12px 0 10px;border-bottom:1px solid var(--edge);margin-bottom:14px}
.head h1{margin:0 0 8px;font-size:18px;font-weight:900;display:flex;align-items:baseline;gap:8px}
.head h1 small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.12em}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tab{border:0;background:var(--pill);border-radius:11px;padding:7px 0;font-weight:900;font-size:13px;cursor:pointer}
.tab.sel{background:var(--ink);color:var(--paper)}
.tab .bd{display:inline-block;min-width:16px;margin-left:2px;border-radius:99px;background:var(--warn);color:#fff;font-size:10.5px;padding:0 4px}
h2{font-size:19px;font-weight:900;margin:2px 0 4px;letter-spacing:.1em}
.hint{font-size:12.8px;color:var(--muted);margin:0 0 10px}
.card{background:var(--field);border:1px solid var(--edge);border-radius:20px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:900;border-radius:99px;padding:3px 12px;background:var(--ink);color:var(--paper);white-space:nowrap}
.pill.s{background:var(--pill);color:var(--deep)}.pill.w{background:var(--warnbg);color:var(--warn)}
.meta{font-size:12px;color:var(--muted)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--pill)}
.rows>span:nth-child(odd){color:var(--muted)}
.rows>span:nth-child(even){font-weight:800;text-align:right}
.rows a{color:inherit;text-decoration-color:var(--sage)}
.big{font-size:28px;font-weight:900;margin:6px 0 0;font-variant-numeric:tabular-nums}
.note{background:var(--pill);border-radius:12px;padding:10px 12px;font-size:12.8px;line-height:1.65;margin-top:10px}
.note.ok{background:var(--okbg);color:#3E5530}.note.warn{background:var(--warnbg);color:#7A520F}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:8px;padding:1px 8px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.g{background:var(--chip);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:0;background:var(--chip);box-shadow:inset 0 0 0 1px var(--edge);border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px;cursor:pointer}
.chip.sel{background:var(--ink);color:var(--paper);box-shadow:none}
.chip.dark{background:var(--ink);color:var(--paper);box-shadow:none}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:0;background:var(--chip);box-shadow:inset 0 0 0 1px var(--edge);border-radius:13px;padding:7px 11px;font-weight:800;font-size:14px;cursor:pointer;text-align:left;line-height:1.3}
.opt small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.opt.sel{background:var(--sage);box-shadow:inset 0 0 0 2px var(--ink)}
.hl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--okbg);flex-wrap:wrap}
.hl span{font-weight:800;font-size:14px}.hl b{font-size:15.5px;font-weight:900;color:var(--ok)}
.hl.off{background:var(--chip)}.hl.off b{color:var(--muted)}
.fine{margin:8px 0 0;padding-left:1.1em;font-size:11.8px;line-height:1.7;color:var(--muted)}
.fine2{font-size:11.8px;color:var(--muted);margin:8px 0 0;line-height:1.7}
.lab{font-size:13px;font-weight:800;margin:10px 0 3px;display:block}
.lab small{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:4px}
.fld{width:100%;border:1.5px solid var(--edge);background:#fff;border-radius:11px;padding:8px 11px;font-size:16px}
textarea.fld{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.g2>*,.g3>*{min-width:0}
.fld[type=date],.fld[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;min-height:42px;text-align:left}
.fld::-webkit-date-and-time-value{text-align:left}
/* 預約月曆 */
.bcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.bcal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.bcal button{border:0;min-height:62px;border-radius:10px;background:var(--chip);opacity:.4;padding:4px 3px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;color:var(--ink);font:inherit}
.bcal button .n{font-weight:900;font-size:13px}
.bcal button.open{background:#fff;opacity:1;box-shadow:inset 0 0 0 1.5px var(--edge)}
.bcal button.has{opacity:1;background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.bcal button.today .n{background:var(--ink);color:var(--paper);border-radius:99px;padding:0 6px;align-self:flex-start}
.bcal button.sel{outline:3px solid var(--sage);outline-offset:1px}
.bcal button i{font-style:normal;font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bcal button i.w{color:var(--warn)}.bcal button i.d{color:var(--muted)}
.bcnav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.bcnav button{border:0;background:var(--chip);border-radius:99px;width:36px;height:36px;font-size:18px;font-weight:900;cursor:pointer}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.line.t{border-top:1px solid var(--pill);margin-top:6px;padding-top:9px;font-weight:900;font-size:16px}
.line .minus{color:var(--ok);font-weight:800}
.line input{width:90px;border:1.5px solid var(--edge);border-radius:8px;padding:3px 6px;text-align:right;font-size:15px;background:#fff}
.item{display:grid;grid-template-columns:1fr 92px 28px;gap:6px;align-items:center;margin:4px 0}
.item input{border:1.5px solid var(--edge);background:#fff;border-radius:9px;padding:5px 8px;font-size:15px;width:100%}
.x{border:0;background:none;color:var(--red);font-size:18px;cursor:pointer}
.mini{border:0;background:none;font-weight:800;font-size:13px;cursor:pointer;padding:4px 0;color:var(--deep)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:11px;font-weight:900;font-size:15px;cursor:pointer;background:var(--ink);color:var(--paper);margin-top:10px;text-align:center;text-decoration:none}
.btn.g{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.btn:disabled{opacity:.5}

<body>
<div class="wrap">
  <div class="head">
    <h1>Maimine 管理頁 <small>MAIMINE . STUDIO</small></h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="pane"><div class="loading">載入中…</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="cfm" id="cfm" hidden></div>
<div class="busy" id="busy"><span>處理中…</span></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbxPxZpN-_GW19fy5qL6mN-DXh78cEEJFmbC9EsBecf0c0hmxTGP1Ln6k57g6bXsmvR-aA/exec";

/* ======================================================================
   小工具
   ====================================================================== */
const WD = ["日","一","二","三","四","五","六"];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const P = ds => { const [y,m,d] = ds.split("-").map(Number); return new Date(y, m-1, d); };
const S8 = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const addM = (ds, months) => { const d = P(ds), whole = Math.trunc(months), frac = months - whole, day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+whole); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); if(frac) d.setDate(d.getDate() + Math.round(frac*30)); return S8(d); };
const addD = (ds, n) => { const d = P(ds); d.setDate(d.getDate()+n); return S8(d); };
const days = (a, b) => Math.round((P(b) - P(a)) / 86400000);
const fmt = ds => { const d = P(ds); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
const fmtW = ds => { const d = P(ds); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const money = n => (n < 0 ? "−$" : "$") + Math.abs(Number(n)||0).toLocaleString();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fill = (t, o) => String(t).replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
const hoursBetween = (a, b) => { const [h1,m1] = a.split(":").map(Number), [h2,m2] = b.split(":").map(Number); return Math.round(((h2*60+m2) - (h1*60+m1)) / 30) / 2; };
const TIMES = []; for(let m = 10*60; m <= 21*60; m += 30) TIMES.push(pad(Math.floor(m/60)) + ":" + pad(m%60));
const ACTIVE = ["待確認","待付定金","已預約"];
function toast(t, err){ const el = $("toast"); el.textContent = t; el.className = "toast" + (err ? " err" : ""); el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", err ? 5000 : 3000); }
function applyTheme(t){ if(!t) return; const r = document.documentElement.style; ["paper","sage","pill","ink"].forEach(k => { if(/^#[0-9a-fA-F]{6}$/.test(t[k]||"")) r.setProperty("--"+k, t[k]); }); }

/* ======================================================================
   資料
   ====================================================================== */
let DATA = null;
const UI = { tab:"book", bview:"todo", forms:{}, open:null, editing:null, edraft:null, paste:"", linking:null, linkPick:null, linkQ:null,
  refPick:null, refQ:"", refSet:{}, detail:null, editC:null, q:"", filter:"all", addCust:false, acctM:null, range:"m", from:"", to:"", showImg:null, addBk:false,
  curMonth:null, draft:null, calMode:"open", cfg:null };
const today = () => DATA.today;
const CFG = () => DATA.cfg;
const SETT = () => DATA.settings;
const custOf = id => DATA.customers.find(c => c.id === id);
const custName = id => (custOf(id) || {}).name || "";
const visitsOf = cid => DATA.visits.filter(v => v.cid === cid);
const isNewCust = c => !c || !visitsOf(c.id).some(v => v.kind === "施作");
const pkgOptions = () => [{ paid:CFG().trialPrice, months:0, label:"單次" }].concat(CFG().addons.map(a => ({ paid:CFG().trialPrice + a.add, months:a.months, label:`含 ${a.months} 個月補色券` })));
const locOf = name => CFG().locations.find(l => l.name === name) || CFG().locations[0] || { name, address:"", rooms:[] };
const addrOf = loc => (locOf(loc) || {}).address || SETT().addresses[loc] || "";
const bdayTxt = c => { if(!c.bday) return ""; const [,m,d] = c.bday.split("-").map(Number); return `${m}/${d}`; };
const bdayThisMonth = (c, on) => c.bday && c.bday.slice(5,7) === on.slice(5,7);
const findRef = x => { if(!x) return null; const k = String(x).trim().toUpperCase(), dg = k.replace(/\D/g,""); return DATA.customers.find(c => c.code === k) || (/^09\d{8}$/.test(dg) ? DATA.customers.find(c => c.phone === dg) : null); };
function refOf(b, c){
  if(b.service === "補色" || !isNewCust(c)) return null;
  if(b.id in UI.refSet) return UI.refSet[b.id] ? custOf(UI.refSet[b.id]) : null;
  if(b.refId) return custOf(b.refId) || null;
  const r = findRef(b.referrer); return r && (!c || r.id !== c.id) ? r : null;
}

/* 補色券、續補、抵用金（跟預約頁同一套算法） */
const lastTreat = cid => visitsOf(cid).filter(v => v.kind === "施作").sort((a,b) => b.date.localeCompare(a.date))[0];
function touchup(cid, on){
  const v = lastTreat(cid);
  if(!v) return { price:null, tag:"新客", why:"沒有施作紀錄，依當時價格計算" };
  const months = Number(v.months)||0, base = Number(v.base)||CFG().trialPrice, value = (Number(v.paid)||0) - base, again = Number(v.again) || (months ? CFG().againWith : CFG().againWithout);
  const yearEnd = addM(v.date, 12), freeEnd = months ? addM(v.date, months) : null;
  const o = { v, yearEnd, freeEnd, months, base, value, again };
  if(months && !v.voucherUsed){
    if(on <= freeEnd) return { ...o, price:0, tag:"補色券", why:`${fmt(v.date)} 施作購買的補色券，${fmt(freeEnd)} 前免費使用`, useVoucher:true };
    if(on <= yearEnd) return { ...o, price:Math.max(0, again - value), tag:"補色券逾期・補差價", why:`補色券已在 ${fmt(freeEnd)} 到期，${fmt(yearEnd)} 前補差價 ${money(again - value)} 即可使用`, useVoucher:true };
    return { ...o, price:Math.max(0, base - value), tag:"補色券逾期・補差價", why:`已超過 ${fmt(yearEnd)}，補差價 ${money(base - value)} 即可使用（依 ${fmt(v.date)} 購買時的體驗價 ${money(base)} 計算）`, useVoucher:true };
  }
  if(on <= yearEnd) return { ...o, price:again, tag:months ? "續補優惠" : "一年內補色", why:`${fmt(yearEnd)} 前補色，每次 ${money(again)}` };
  return { ...o, price:null, tag:"重新施作", why:`已超過 ${fmt(yearEnd)}，視為重新施作，依當時價格計算` };
}
function credit(c, on){
  const bal = Number(c.credit)||0;
  if(!bal || !c.creditExp) return { bal:0, exp:null };
  if(on > c.creditExp) return { bal:0, exp:c.creditExp, lost:bal };
  return { bal, exp:c.creditExp };
}

/* 定金：補色券免費補色不收；沒特別設定就用「其他設定」的定金 */
const depOf = b => b.dep === "" || b.dep == null ? SETT().deposit : Number(b.dep) || 0;
const isFreeTouch = (b, c) => b.service === "補色" && !!c && touchup(c.id, b.date).price === 0;
const transitOf = loc => (locOf(loc) || {}).transit || "";

/* 日期可以打 2023.5.12、2023/5/12、20230512，或民國 112.5.12 */
function parseDay(s){
  s = String(s || "").trim(); if(!s) return "";
  const m = s.match(/^(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})\D*$/) || s.match(/^(\d{4})(\d{2})(\d{2})$/) || s.match(/^(\d{3})(\d{2})(\d{2})$/);
  if(!m) return null;
  let y = Number(m[1]); const mo = Number(m[2]), d = Number(m[3]);
  if(y < 1000) y += 1911;
  const dt = new Date(y, mo-1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== mo-1 || dt.getDate() !== d) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}
const fmtDot = ds => { if(!ds) return ""; const [y,m,d] = ds.split("-").map(Number); return `${y}.${m}.${d}`; };
const dayIn = (id, v) => `<input class="fld" id="${id}" value="${esc(v)}" inputmode="decimal" placeholder="2023.5.12" autocomplete="off">`;
const DAY_HINT = `<p class="fine2" style="margin:4px 0 0">日期可以打 2023.5.12、20230512，或民國 112.5.12</p>`;

/* 估算支出：還沒開始記帳的月份，用「客人數 × 金額」 */
const EST = () => Object.assign({ until:"", perVisit:0 }, CFG().estimate || {});
const isEstMonth = m => { const e = EST(); return !!(e.until && Number(e.perVisit) && m <= e.until); };
const visitsInMonth = m => DATA.visits.filter(v => (v.date || "").startsWith(m));
const visitCost = v => Number(v.rent) > 0 ? Number(v.rent) : Number(EST().perVisit) || 0;
const estOf = list => { const real = list.filter(v => Number(v.rent) > 0), rest = list.length - real.length;
  return { real:real.length, realAmt:real.reduce((s,v) => s + Number(v.rent), 0), rest, restAmt:rest * (Number(EST().perVisit) || 0), total:list.reduce((s,v) => s + visitCost(v), 0) }; };
const costOfMonth = m => isEstMonth(m) ? estOf(visitsInMonth(m)).total : DATA.expenses.filter(e => e.date.startsWith(m)).reduce((s,e) => s + (Number(e.amt)||0), 0);

/* ======================================================================
   跟後台溝通
   ====================================================================== */
async function api(action, data, quiet){
  if(!quiet) $("busy").classList.add("show");
  try{
    const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, data || {})) });
    const j = await r.json();
    if(j.conflict){
      $("busy").classList.remove("show");
      if(confirm(j.error)) return api(action, Object.assign({}, data, { force:true }), quiet);
      throw new Error("沒有變更");
    }
    if(!j.ok){
      if(/登入已過期/.test(j.error || "") && !liff.isInClient()){
        try{ sessionStorage.removeItem("mm_relogin"); }catch(_){}
        if(confirm("LINE 登入過期了，要重新登入嗎？\n（剛剛這個動作沒有存到，登入後請再做一次）")) relogin();
      }
      throw new Error(j.error || "操作失敗");
    }
    if(j.bookings && DATA) Object.assign(DATA, j);
    if(j.bookings) LS.set("mm_admin_data", DATA || j);
    return j;
  } finally { $("busy").classList.remove("show"); }
}

const LS = {
  get: k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(_){ return null; } },
  set: (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
};
async function boot(){
  try{
    let id = LS.get("mm_admin_liff");
    if(!id){
      const pub = await (await fetch(API)).json();
      id = pub.liff && pub.liff.admin;
      if(!id){ $("pane").innerHTML = `<div class="loading">還沒設定管理頁的 LIFF ID（ADMIN_LIFF_ID）。</div>`; return; }
      LS.set("mm_admin_liff", id);
    }
    try{ await liff.init({ liffId: id }); }
    catch(e){ LS.set("mm_admin_liff", null); throw e; }
    if(!liff.isLoggedIn()){ if(relogin()) return; throw new Error("LINE 登入沒有成功"); }
    // 在 LINE 外面（主畫面、Safari）登入大約一小時就過期，過期或快過期就自動重新登入
    if(!liff.isInClient()){
      let exp = 0; try{ exp = (liff.getDecodedIDToken() || {}).exp || 0; }catch(_){}
      if(exp * 1000 < Date.now() + 5 * 60 * 1000){ if(relogin()) return; throw new Error("LINE 登入已過期，自動重新登入沒有成功"); }
    }
    try{ sessionStorage.removeItem("mm_relogin"); }catch(_){}
    // 先顯示上次的資料（只能看，不能按），後台讀完再換成最新的
    const cached = LS.get("mm_admin_data");
    if(cached && cached.customers){ DATA = cached; applyTheme(SETT().theme); render(); document.body.classList.add("stale"); }
    DATA = await api("adminLoad", {}, true);
    document.body.classList.remove("stale");
    applyTheme(SETT().theme);
    render();
  }catch(err){
    document.body.classList.remove("stale");
    if(/登入已過期/.test(err.message) && !/自動重新登入/.test(err.message) && relogin()) return;
    const id = LS.get("mm_admin_liff");
    $("pane").innerHTML = `<div class="loading">載入失敗：${esc(err.message)}
      ${id ? `<a class="btn" style="display:block;margin:18px auto 0;max-width:280px;text-decoration:none;text-align:center" href="https://liff.line.me/${esc(id)}">用 LINE 打開管理頁</a>` : ""}
      <button type="button" class="btn g" style="display:block;margin:10px auto 0;max-width:280px;width:100%" onclick="location.reload()">重新整理</button></div>`;
  }
}

/* 重新登入 LINE：在 LINE 外面才需要；同一次打開只自動試一次，避免一直跳轉 */
function relogin(){
  if(window.liff && liff.isInClient && liff.isInClient()) return false;
  let n = 0; try{ n = Number(sessionStorage.getItem("mm_relogin")) || 0; }catch(_){}
  if(n >= 1) return false;
  try{ sessionStorage.setItem("mm_relogin", String(n + 1)); }catch(_){}
  try{ if(liff.isLoggedIn()) liff.logout(); }catch(_){}
  liff.login({ redirectUri: location.origin + location.pathname });
  return true;
}

let pendingRender = false;

function flushRender(){ if(!pendingRender || typing()) return; pendingRender = false; const y = window.scrollY; render(); window.scrollTo(0, y); }
function renderSoon(){ pendingRender = true; setTimeout(flushRender, 60); }
document.addEventListener("focusout", () => setTimeout(flushRender, 60));

/* ======================================================================
   傳 LINE 前先確認
   msgs = [{ to, tag, text, buttons, line }]；按確認才會 onSend(改過的文字)
   ====================================================================== */
function confirmSend(msgs, also, onSend){
  const box = $("cfm"), texts = msgs.map(m => m.text), editing = {};
  const any = msgs.some(m => m.line !== false);
  const draw = () => {
    box.innerHTML = `<div class="sheet"><h3>${any ? "確認要傳出的 LINE" : "確認一下"}</h3>${any ? `<p class="hint" style="margin:0">LINE 傳出去就不能收回，看一下內容對不對。可以直接改文字。</p>` : ""}
      ${msgs.map((m,i) => `<div class="to"><span>傳給 ${esc(m.to)}</span>${m.line === false ? "" : `<button type="button" class="mini" data-cfe="${i}">${editing[i] ? "完成" : "✏️ 改文字"}</button>`}</div>` +
        (m.line === false ? `<div class="nol">⚠️ ${esc(m.to)} 沒有綁定 LINE，不會傳出，記得自己告訴她</div>` :
        `<div class="chat"><div class="ban">${esc(m.tag)}</div>${editing[i] ? `<textarea data-cft="${i}">${esc(texts[i])}</textarea>` : `<div class="bubble">${esc(texts[i])}</div>`}${(m.buttons||[]).length ? `<div class="bb">${m.buttons.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}</div>`)).join("")}
      ${also && also.length ? `<div class="also"><b>同時會：</b><br>${also.map(a => "・" + esc(a)).join("<br>")}</div>` : ""}
      <button type="button" class="btn" id="cfm-ok" style="margin-top:14px">${any ? "確認，傳出去" : "確認"}</button>
      ${any ? `<button type="button" class="btn g" id="cfm-q">照做，但不傳 LINE</button>` : ""}
      <button type="button" class="btn g" id="cfm-x">先不要，回去改</button></div>`;
    box.querySelectorAll("[data-cft]").forEach(x => x.oninput = () => { texts[Number(x.dataset.cft)] = x.value; });
    box.querySelectorAll("[data-cfe]").forEach(x => x.onclick = () => { const i = x.dataset.cfe; editing[i] = !editing[i]; draw(); });
    $("cfm-x").onclick = () => { box.hidden = true; toast("還沒傳，也沒有改任何東西"); };
    $("cfm-ok").onclick = () => { box.hidden = true; onSend(texts, false); };
    if($("cfm-q")) $("cfm-q").onclick = () => { if(!confirm("確定只改資料、不傳 LINE 給客人嗎？")) return; box.hidden = true; onSend(texts.map(() => ""), true); };
  };
  draw(); box.hidden = false; box.scrollTop = 0;
}

  const chips = [["todo",`待處理 ${todo.length}`],["agenda",`行程 ${up.length}`],["cal","📅 月曆"],["done","已結束"]].map(([k,t]) => `<button type="button" class="chip${UI.bview===k?" sel":""}" data-bv="${k}">${t}</button>`).join("");

/* 預約月曆：只標出公開的預約日和有預約的日子，其他（倉、休、沒開放）一律反灰 */
function bookCal(on){
  UI.bcm = UI.bcm || on.slice(0,7);
  const m = UI.bcm, [y, mm] = m.split("-").map(Number);
  const first = new Date(y, mm-1, 1).getDay(), dcount = new Date(y, mm, 0).getDate();
  const M = DATA.months.find(x => x.month === m), open = M && M.visible !== false ? M.openDays || [] : [];
  const shown = ["待確認","待付定金","已預約","已完成"];
  const list = DATA.bookings.filter(b => shown.includes(b.status) && b.date.startsWith(m)).sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
  let cal = WD.map(w => `<div class="wd">${w}</div>`).join("") + "<div></div>".repeat(first);
  for(let d = 1; d <= dcount; d++){
    const ds = `${m}-${pad(d)}`, bs = list.filter(b => b.date === ds);
    const cls = [bs.length ? "has" : open.includes(d) ? "open" : "", ds === on ? "today" : "", UI.bcd === ds ? "sel" : ""].filter(Boolean).join(" ");
    cal += `<button type="button" class="${cls}" data-cd="${ds}"><span class="n">${d}</span>${bs.slice(0,2).map(b => { const k = b.status === "已完成" ? "d" : b.status === "已預約" ? "" : "w"; return `<i class="${k}">${esc(b.start)}</i><i class="${k}" style="font-weight:900">${esc(b.name)}</i>`; }).join("")}${bs.length > 2 ? `<i>＋${bs.length - 2}</i>` : ""}</button>`;
  }
  const day = UI.bcd && UI.bcd.startsWith(m) ? list.filter(b => b.date === UI.bcd) : [];
  return `<div class="card" style="padding:12px">
      <div class="bcnav"><button type="button" data-cm="-1" aria-label="上個月">‹</button><b>${y} 年 ${mm} 月</b><button type="button" data-cm="1" aria-label="下個月">›</button></div>
      <div class="bcal">${cal}</div>
      <p class="fine2" style="margin:8px 0 0">白底＝開放預約的日子；黑框＝有預約；<span style="color:var(--warn)">橘字</span>＝還沒成立。點日子看當天的預約。</p></div>
    ${UI.bcd ? `<div class="sec">${fmtW(UI.bcd)}</div>` + (day.map(b => ACTIVE.includes(b.status) ? bkCard(b, on, true) : `<div class="card"><b class="bk-time">${b.start}</b>　${esc(b.name)}<span class="meta">・${esc(b.service)}・已完成</span></div>`).join("") || `<div class="empty">這天沒有預約</div>`) : ""}`;
}

function changesOf(b, d){
  const out = [];
  if(d.date !== b.date) out.push(["日期", fmtW(b.date), fmtW(d.date)]);
  if(d.start !== b.start) out.push(["時間", b.start, d.start]);
  if(d.loc !== b.loc) out.push(["地點", b.loc, d.loc]);
  if(d.service !== b.service) out.push(["項目", b.service, d.service]);
  return out;
}
function parseStudioMsg(t){
  const o = {}; let m;
  if(m = t.match(/房間名稱[：:]\s*([^$，,\n]+?)\s*\$\s*(\d+)\s*\/\s*時/) || t.match(/房間名稱[：:]\s*([^\s$，,]+)/)) { o.room = m[1].trim(); if(m[2]) o.rate = Number(m[2]); }
  if(m = t.match(/地址[：:]\s*([^，,\n]+?)(?=[，,\n]|詳細|預約時段|$)/)) o.address = m[1].trim();
  if(m = t.match(/預約時段[：:]\s*(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\s+(\d{1,2}:\d{2})\s*[-–~～]\s*(\d{1,2}:\d{2})/)) { o.date = `${m[1]}-${pad(m[2])}-${pad(m[3])}`; o.start = m[4].padStart(5,"0"); o.end = m[5].padStart(5,"0"); }
  if(m = t.match(/(?:門鎖)?密碼[：:]\s*([0-9A-Za-z#*]+)/)) o.code = m[1];
  if(m = t.match(/https?:\/\/[^\s，,]+/)) o.link = m[0];
  return o;
}

function voucherCard(c, on){

  let main, fine = [];

    if(t.freeEnd < t.yearEnd) fine.push(`${fmt(addD(t.freeEnd,1))}～${fmt(t.yearEnd)}：補差價 ${money(t.again - t.value)}`);
    fine.push(`${fmt(addD(t.yearEnd,1))} 起：補差價 ${money(t.base - t.value)}`);
    fine.push(`續補優惠：${fmt(t.yearEnd)} 前，每次 ${money(t.again)}`);

function wireCredit(c, on){

    const send = n > 0 && !!c.userId && f.notify, tag = friend ? "推薦成功" : "抵用金";
    const vars = { name:c.name, friend: friend ? friend.name : "", reward:money(n), amount:money(bal), date: exp ? fmt(exp) : "", why, months:CFG().creditMonths };
    const text = fill(friend ? CFG().texts.reward : (CFG().texts.gift || "🎁 {why}\n你獲得 {reward} 抵用金\n目前抵用金：{amount}\n有效至 {date}"), vars);
    confirmSend(send ? [{ to:c.name, tag, text, buttons:["我的預約"] }] : [], also, t => run(async () => {
      await api("adminCredit", { cid:c.id, amt:n, why, date, friendId: friend ? friend.id : "", msg: send && t[0] ? { text:t[0], tag } : null });
      UI.cr = crBlank();
    }, "抵用金已更新"));
  };
}

/* ---------- 批次補登：從試算表整片貼上 ---------- */
const IMP_RENT = 0, IMP_ADDON = 2500, IMP_AGAIN_WITH = 2500, IMP_AGAIN_WITHOUT = 3000, IMP_MONTHS = 12;
const IMP_HEAD = ["姓名","手機","IG／LINE","生日","日期","種類","項目","體驗價","補色券","補色價","工作室","租金","備註"];
const IMP_COLS = { name:["姓名","名字"], phone:["手機","電話"], ig:["IG","LINE"], bday:["生日"], date:["日期","施作日期"], kind:["種類"], service:["項目"],
  base:["體驗價"], voucher:["補色券"], price:["補色價"], paid:["包套金額"], again:["續補價"], revenue:["實收"], loc:["工作室","地點"], rent:["租金","場地租金"], note:["備註"] };
function impSplit(text){
  const out = []; let row = [], cell = "", q = false;
  const sep = text.split(/\r?\n/)[0].includes("\t") ? "\t" : ",";
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if(ch === '"' && cell === "") q = true;
    else if(ch === sep){ row.push(cell); cell = ""; }
    else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i+1] === "\n") i++; row.push(cell); out.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell); out.push(row);
  return out.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
}
function impParse(text){
  const all = impSplit(text);
  if(all.length < 2) return { err:"至少要有表頭和一列資料" };
  const keys = all[0].map(h => { const k = h.replace(/\s/g,"").toUpperCase(); return Object.keys(IMP_COLS).find(x => IMP_COLS[x].some(a => k.startsWith(a.toUpperCase()))) || null; });
  if(!keys.includes("name") || !keys.includes("date")) return { err:"第一列要是表頭，至少要有「姓名」和「日期」" };
  const on = today(), groups = [];
  let prev = null;
  all.slice(1).forEach((r, i) => {
    const o = { line:i + 2 }; keys.forEach((k, j) => { if(k) o[k] = r[j] || ""; });
    if(!o.name && !o.phone && prev){ o.name = prev.name; o.phone = prev.phone; }
    prev = o;
    o.phone = (o.phone || "").replace(/\D/g,"");
    if(o.phone.length === 9 && o.phone[0] === "9") o.phone = "0" + o.phone;
    let g = groups.find(g => (o.phone && g.phone === o.phone) || (g.name === o.name && (!o.phone || !g.phone)));
    if(!g){ g = { name:o.name, phone:o.phone, ig:"", bday:"", note:"", rows:[], errs:[] }; groups.push(g); }
    if(o.phone && !g.phone) g.phone = o.phone;
    if(o.ig && !g.ig) g.ig = o.ig;
    if(o.note && !g.note) g.note = o.note;
    if(o.bday && !g.bday){ const b = parseDay(o.bday); if(b) g.bday = b; else g.errs.push(`第 ${o.line} 列：生日「${o.bday}」看不懂，要有年份（例如 1995.3.8），不知道年份就空著`); }
    if(o.date || o.kind || o.service) g.rows.push(o);
  });
  const num = s => { s = String(s ?? "").trim(); return s === "" ? null : Number(s.replace(/[^\d]/g,"")) || 0; };
  const yes = s => /^(有|是|v|y|yes|✓|✔|o|ok|12|加購)/i.test(String(s || "").trim());
  groups.forEach(g => {
    if(!g.name) g.errs.push("有一列沒有姓名");
    const byPhone = g.phone && DATA.customers.find(c => c.phone === g.phone);
    const byName = DATA.customers.filter(c => c.name.trim() === g.name);
    g.cust = byPhone || (byName.length === 1 && (!byName[0].phone || !g.phone) ? byName[0] : null);
    if(!g.cust && byName.length) g.warn = `已經有叫「${g.name}」的客人，但手機不同，會新增成另一位`;
    const old = g.cust ? visitsOf(g.cust.id) : [];
    const treats = old.filter(v => v.kind === "施作").map(v => ({ date:v.date, months:Number(v.months) || 0, again:Number(v.again) || (Number(v.months) ? CFG().againWith : CFG().againWithout), used:!!v.voucherUsed, usedOn:v.usedOn || "", dbId:v.id }));
    g.out = []; g.useVouchers = [];
    // 日期沒寫年份（5/9、5.9、5月9日）就補今年；補完是未來的日期就算去年
    const withYear = s => { s = String(s || "").trim(); const m = s.match(/^(\d{1,2})\s*[.\/\-月]\s*(\d{1,2})\s*日?$/);
      if(!m) return s; const y = Number(on.slice(0,4)); const d = parseDay(`${y}.${m[1]}.${m[2]}`); return d && d > on ? `${y-1}.${m[1]}.${m[2]}` : `${y}.${m[1]}.${m[2]}`; };
    g.rows.forEach(o => { o.dt = parseDay(withYear(o.date)); });
    g.rows.slice().sort((a,b) => (a.dt || "").localeCompare(b.dt || "")).forEach(o => {
      const e = { line:o.line, date:o.dt, raw:o };
      if(!o.dt){ e.err = `日期「${o.date}」看不懂`; g.out.push(e); return; }
      if(o.dt > on){ e.err = "日期在未來"; g.out.push(e); return; }
      e.kind = /補色/.test(o.kind) || (!o.kind && /補色/.test(o.service)) ? "補色" : "施作";
      if(g.cust && old.some(v => v.date === o.dt && (v.kind === "補色" ? "補色" : "施作") === e.kind) || g.out.some(x => x.date === o.dt && x.kind === e.kind && !x.err)){ e.skip = "已經有這筆，略過"; g.out.push(e); return; }
      const rent = num(o.rent); e.rent = rent === null ? IMP_RENT : rent; e.loc = (o.loc || "").trim();
      const rev = num(o.revenue);
      if(e.kind === "施作"){
        e.service = (o.service || "").trim(); if(!e.service){ e.err = "缺「項目」（霧眉、飄眉…）"; g.out.push(e); return; }
        e.base = num(o.base); if(!e.base){ e.err = "缺「體驗價」"; g.out.push(e); return; }
        e.months = yes(o.voucher) ? IMP_MONTHS : 0;
        e.paid = num(o.paid) || e.base + (e.months ? IMP_ADDON : 0);
        e.again = num(o.again) || (e.months ? IMP_AGAIN_WITH : IMP_AGAIN_WITHOUT);
        e.voucherUsed = false; e.usedOn = ""; e.revenue = rev === null ? e.paid : rev;
        treats.push({ date:e.date, months:e.months, again:e.again, used:false, ref:e });
      } else {
        const t = treats.filter(t => t.date < e.date).sort((a,b) => b.date.localeCompare(a.date))[0];
        const freeOk = t && t.months && !t.used && e.date <= addM(t.date, t.months);
        const set = num(o.price);
        const sameDay = t && t.used && t.usedOn === e.date;   // 補色券已經記成這天用掉了（只是少了補色那筆）
        if(set !== null) e.price = set;
        else if(sameDay){ e.price = 0; e.usedVoucher = true; }
        else if(!t){ e.err = "找不到之前的施作，請填「補色價」"; g.out.push(e); return; }
        else if(freeOk) e.price = 0;
        else if(e.date <= addM(t.date, 12)) e.price = t.again;
        else { e.err = "離上次施作超過一年，請填「補色價」"; g.out.push(e); return; }
        if(e.price === 0 && freeOk){ t.used = true; e.usedVoucher = true; if(t.ref){ t.ref.voucherUsed = true; t.ref.usedOn = e.date; } else g.useVouchers.push({ id:t.dbId, usedOn:e.date }); }
        e.revenue = rev === null ? e.price : rev;
      }
      g.out.push(e);
    });
    g.out.sort((a,b) => (a.date || "").localeCompare(b.date || ""));
  });
  const errs = groups.reduce((n,g) => n + g.errs.length + g.out.filter(e => e.err).length, 0);
  return { groups, errs };
}

    </div>`).join("")}
    ${P.errs ? "" : `<div class="btns"><button type="button" class="btn" id="imp-go">確定匯入</button></div>`}`;
  }
  return `<div class="card"><b>批次補登</b>

        : { date:e.date, kind:"補色", price:e.price, loc:e.loc, rent:e.rent, revenue:e.revenue }),

  $("cal").querySelectorAll("button").forEach(b => b.onclick = () => {

    const d = Number(b.dataset.d), cur = M.openDays.includes(d) ? "open" : (M.marks[d] || "clear");

}
function wireMonthChips(latest){
  document.querySelectorAll("[data-mm]").forEach(b => b.onclick = () => { UI.curMonth = b.dataset.mm; UI.draft = null; render(); });
  $("newMonth").onclick = () => {
    const src = DATA.months[DATA.months.length-1] || { tag:"", items:"", plans:[], notes:"" }, m = nextMonthOf(latest);
    DATA.months.push({ month:m, openDays:[], header:"", headerUrl:"", tag:(src.tag||"").replace(/\d+月/, Number(m.slice(5)) + "月"), items:src.items, plans:JSON.parse(JSON.stringify(src.plans||[])), notes:src.notes, visible:false, marks:{} });
    UI.curMonth = m; UI.draft = null; render(); toast("已複製上個月的活動和須知，改完記得按儲存");
  };
}

    catch(err){ toast(err.message, true); } };
  if($("s-rmimg")) $("s-rmimg").onclick = () => run(async () => { const r = await api("adminSaveSettings", { settings:{ payImage:"" } }); DATA.settings = r.settings; }, "已移除");
  pane.querySelectorAll("[data-bn]").forEach(inp => inp.onchange = async e => { const f = e.target.files[0], k = inp.dataset.bn; if(!f) return;
    try{ const data = await resizeImage(f, 1040, 0.88); const j = await api("adminUpload", { data, mime:"image/jpeg", name:`banner-${k}.jpg` }); const r = await api("adminSaveSettings", { settings:{ banners:{ [k]: j.id } } }); DATA.settings = r.settings; render(); toast(`「${k}」橫幅已更新`); }
    catch(err){ toast(err.message, true); } });
  pane.querySelectorAll("[data-bnrm]").forEach(b => b.onclick = () => run(async () => { const r = await api("adminSaveSettings", { settings:{ banners:{ [b.dataset.bnrm]: "" } } }); DATA.settings = r.settings; }, "已移除"));
  $("save-set").onclick = () => {
    if(C.locations.some(l => !l.name)){ toast("工作室名稱不能空白", true); return; }
    const handle = String(C.igHandle || "").replace(/^@/, "").trim(); C.igHandle = handle; if(handle) C.igUrl = "https://instagram.com/" + handle;
    const theme = {}; THEME_FIELDS.forEach(([k]) => theme[k] = $("t-"+k).value);
    const payInfo = $("s-pay").value;
    run(async () => { await api("adminSaveCfg", { cfg:C }); const r = await api("adminSaveSettings", { settings:{ payInfo, theme } }); DATA.settings = r.settings; applyTheme(r.settings.theme); UI.cfg = null; }, "已儲存");
  };
}

/* ---------- 圖片壓縮 ---------- */
function resizeImage(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => { const sc = Math.min(1, maxW / img.width), c = document.createElement("canvas");
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality).split(",")[1]); };
      img.onerror = () => reject(new Error("這張圖片讀不到，換一張試試"));
      img.src = fr.result; };
    fr.onerror = () => reject(new Error("這張圖片讀不到，換一張試試"));
    fr.readAsDataURL(file);
  });
}
