<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maimine 管理頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 米白底、鼠尾草綠、淺綠灰、墨黑；管理頁「設定」裡可以換 */
  --paper:#F0EFEA; --sage:#A2AA93; --pill:#D4D6C8; --ink:#161616;
  --okbg:#E3EBD9; --ok:#4F6B3A; --warnbg:#F6EAD3; --warn:#9A6514; --red:#A8483A; --muted:#6B6E66;
  --cang:#E2CDA8; --cang-ink:#6B4F2A; --rest:#E3C4C4; --rest-ink:#7A4545;
  --body:"Nunito","Chiron GoRound TC","PingFang TC",system-ui,sans-serif;
  color-scheme:light;
}
:root{
  --chip:color-mix(in srgb,var(--pill) 50%,var(--paper));
  --field:color-mix(in srgb,#fff 55%,var(--paper));
  --edge:color-mix(in srgb,var(--pill) 82%,var(--ink));
  --deep:color-mix(in srgb,var(--sage) 58%,var(--ink));
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 80px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--deep);outline-offset:2px}
.head{position:sticky;top:0;z-index:6;background:var(--paper);padding:12px 0 10px;border-bottom:1px solid var(--edge);margin-bottom:14px}
.head h1{margin:0 0 8px;font-size:18px;font-weight:900;display:flex;align-items:baseline;gap:8px}
.head h1 small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.12em}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tab{border:0;background:var(--pill);border-radius:11px;padding:7px 0;font-weight:900;font-size:13px;cursor:pointer}
.tab.sel{background:var(--ink);color:var(--paper)}
.tab .bd{display:inline-block;min-width:16px;margin-left:2px;border-radius:99px;background:var(--warn);color:#fff;font-size:10.5px;padding:0 4px}
h2{font-size:19px;font-weight:900;margin:2px 0 4px;letter-spacing:.1em}
.hint{font-size:12.8px;color:var(--muted);margin:0 0 10px}
.card{background:var(--field);border:1px solid var(--edge);border-radius:20px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:900;border-radius:99px;padding:3px 12px;background:var(--ink);color:var(--paper);white-space:nowrap}
.pill.s{background:var(--pill);color:var(--deep)}.pill.w{background:var(--warnbg);color:var(--warn)}
.meta{font-size:12px;color:var(--muted)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--pill)}
.rows>span:nth-child(odd){color:var(--muted)}
.rows>span:nth-child(even){font-weight:800;text-align:right}
.rows a{color:inherit;text-decoration-color:var(--sage)}
.big{font-size:28px;font-weight:900;margin:6px 0 0;font-variant-numeric:tabular-nums}
.note{background:var(--pill);border-radius:12px;padding:10px 12px;font-size:12.8px;line-height:1.65;margin-top:10px}
.note.ok{background:var(--okbg);color:#3E5530}.note.warn{background:var(--warnbg);color:#7A520F}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:8px;padding:1px 8px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.g{background:var(--chip);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:0;background:var(--chip);box-shadow:inset 0 0 0 1px var(--edge);border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px;cursor:pointer}
.chip.sel{background:var(--ink);color:var(--paper);box-shadow:none}
.chip.dark{background:var(--ink);color:var(--paper);box-shadow:none}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:0;background:var(--chip);box-shadow:inset 0 0 0 1px var(--edge);border-radius:13px;padding:7px 11px;font-weight:800;font-size:14px;cursor:pointer;text-align:left;line-height:1.3}
.opt small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.opt.sel{background:var(--sage);box-shadow:inset 0 0 0 2px var(--ink)}
.hl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--okbg);flex-wrap:wrap}
.hl span{font-weight:800;font-size:14px}.hl b{font-size:15.5px;font-weight:900;color:var(--ok)}
.hl.off{background:var(--chip)}.hl.off b{color:var(--muted)}
.fine{margin:8px 0 0;padding-left:1.1em;font-size:11.8px;line-height:1.7;color:var(--muted)}
.fine2{font-size:11.8px;color:var(--muted);margin:8px 0 0;line-height:1.7}
.lab{font-size:13px;font-weight:800;margin:10px 0 3px;display:block}
.lab small{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:4px}
.fld{width:100%;border:1.5px solid var(--edge);background:#fff;border-radius:11px;padding:8px 11px;font-size:16px}
textarea.fld{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.line.t{border-top:1px solid var(--pill);margin-top:6px;padding-top:9px;font-weight:900;font-size:16px}
.line .minus{color:var(--ok);font-weight:800}
.line input{width:90px;border:1.5px solid var(--edge);border-radius:8px;padding:3px 6px;text-align:right;font-size:15px;background:#fff}
.item{display:grid;grid-template-columns:1fr 92px 28px;gap:6px;align-items:center;margin:4px 0}
.item input{border:1.5px solid var(--edge);background:#fff;border-radius:9px;padding:5px 8px;font-size:15px;width:100%}
.x{border:0;background:none;color:var(--red);font-size:18px;cursor:pointer}
.mini{border:0;background:none;font-weight:800;font-size:13px;cursor:pointer;padding:4px 0;color:var(--deep)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:11px;font-weight:900;font-size:15px;cursor:pointer;background:var(--ink);color:var(--paper);margin-top:10px;text-align:center;text-decoration:none}
.btn.g{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btns .btn{width:auto;flex:1;margin:0;padding:9px 12px;font-size:14px}
.tl{position:relative;padding-left:18px;margin-top:6px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--pill)}
.ti{position:relative;margin-bottom:11px}
.ti:before{content:"";position:absolute;left:-17px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--sage);border:2px solid var(--field)}
.ti .d{font-size:12px;color:var(--muted);font-weight:700}
.ti .t{font-size:14.5px;font-weight:800}
.ti .s{font-size:12.5px;color:var(--muted)}
.src{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px}
.cl{background:var(--field);border:1px solid var(--edge);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;width:100%;text-align:left}
.cl .n{font-weight:900;font-size:15px}.cl .m{font-size:12px;color:var(--muted)}
.cl .r{text-align:right;font-size:12px;color:var(--muted);flex:none}
.cl.pick{box-shadow:inset 0 0 0 2px var(--ink)}
.b{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.b.ln{background:var(--okbg);color:var(--ok)}.b.no{background:var(--warnbg);color:var(--warn)}.b.ph{background:var(--chip);color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--field);border:1px solid var(--edge);border-radius:16px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.main{background:var(--ink);color:var(--paper);border-color:var(--ink);grid-column:1/-1}
.kpi.main .l,.kpi.main .s{color:#C9CDBF}.kpi.main .v{font-size:28px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:8px 0;background:var(--chip)}
.stack i{display:block;height:100%}
.leg{display:grid;gap:5px;font-size:13px}
.leg div{display:flex;align-items:center;gap:8px}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block}
.cols{display:flex;align-items:flex-end;gap:10px;height:120px;padding:6px 4px 0;border-bottom:1px solid var(--edge)}
.col{flex:1;display:flex;gap:3px;align-items:flex-end;height:100%}
.col i{flex:1;border-radius:5px 5px 0 0;min-height:2px}
.xl{display:flex;gap:10px;padding:4px 4px 0;font-size:11.5px;color:var(--muted)}
.xl span{flex:1;text-align:center}
.exp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--pill);font-size:13.5px}
.exp:last-child{border:0}
.exp .d{font-size:11.5px;color:var(--muted)}
.cat{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--chip);color:var(--muted)}
.cat.場地{background:var(--okbg);color:var(--ok)}.cat.耗材{background:var(--warnbg);color:var(--warn)}.cat.色乳{background:#E6E1EE;color:#5B4C7A}
details.adv{border:1px dashed var(--edge);border-radius:14px;padding:0 12px;margin-top:10px}
details.adv summary{cursor:pointer;font-weight:900;padding:10px 0;font-size:14px}
.set{display:grid;grid-template-columns:1fr 110px;gap:6px 10px;align-items:center;font-size:13.5px}
.set input{border:1.5px solid var(--edge);background:#fff;border-radius:9px;padding:5px 8px;width:100%;font-size:15px}
.room{display:grid;grid-template-columns:1fr 1fr 90px 26px;gap:6px;align-items:center;margin:4px 0}
.room input{border:1.5px solid var(--edge);background:#fff;border-radius:9px;padding:5px 8px;width:100%;font-size:15px}
.cfm{position:fixed;inset:0;background:rgba(22,22,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.cfm[hidden]{display:none}
.cfm .sheet{background:var(--paper);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 22px}
.cfm h3{margin:0 0 2px;font-size:18px}
.cfm .to{font-size:13px;font-weight:800;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
.cfm .chat{background:#9BB0C9;border-radius:16px;padding:12px}
.cfm .ban{background:var(--sage);color:var(--ink);border-radius:12px 12px 0 0;padding:8px 12px;font-weight:900;font-size:13px}
.cfm .chat .bubble{border-radius:0 0 12px 12px}
.cfm .bb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cfm .bb span{background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:800}
.cfm textarea{width:100%;min-height:190px;border:1.5px solid var(--edge);border-radius:0 0 12px 12px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.6;background:#fff}
.cfm .also{font-size:12.5px;background:var(--pill);border-radius:12px;padding:8px 12px;margin-top:12px;line-height:1.7}
.cfm .nol{font-size:12.5px;color:var(--warn);margin-top:6px}
.bubble{background:#fff;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6;white-space:pre-line}
.stu{background:#fff;border:1px solid var(--edge);border-radius:14px;padding:10px 12px;margin-top:10px}
.stu.edit{background:var(--field)}
.bk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bk-time{font-size:18px;font-weight:900}
.bk-name{font-weight:800;font-size:15px}
.bk-name .meta{font-weight:600}
.bk-name a{color:var(--deep);font-weight:600;font-size:13px;margin-left:6px}
.stl{margin-top:8px;background:#fff;border:1px solid var(--edge);border-radius:12px;padding:8px 10px;font-size:13.5px}
.stl b{letter-spacing:.08em}
.warn-t{color:var(--warn);font-size:12.5px;font-weight:800;margin-top:2px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts .btn{width:auto;flex:1;margin:0;padding:9px 10px;font-size:14px;min-width:72px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;font-weight:700}
.chk input{width:18px;height:18px;accent-color:var(--deep)}
.shot{display:block;width:100%;margin-top:8px;border-radius:12px;border:1px solid var(--edge)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-weight:800;font-size:13.5px;z-index:60;display:none;max-width:92%;text-align:center}
.toast.err{background:var(--red)}
.busy{position:fixed;inset:0;z-index:70;background:rgba(240,239,234,.6);display:none;align-items:center;justify-content:center;font-weight:900}
.busy.show{display:flex}
.busy span{background:var(--ink);color:var(--paper);border-radius:99px;padding:10px 20px}
.empty{color:var(--muted);background:var(--chip);border-radius:14px;padding:12px;text-align:center;font-size:13.5px}
.sec{font-size:12.5px;color:var(--muted);font-weight:800;letter-spacing:.12em;margin:16px 0 8px}
.back{border:0;background:none;font-weight:800;color:var(--deep);cursor:pointer;padding:0;margin-bottom:8px}
.loading{padding:50px 10px;text-align:center;color:var(--muted)}
/* 月份 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.cal button{position:relative;border:0;aspect-ratio:1;border-radius:10px;background:var(--chip);font-weight:800;font-size:15px;cursor:pointer;color:var(--ink)}
.cal button.on{background:var(--ink);color:var(--paper)}
.cal button.m-倉{background:var(--cang);color:var(--cang-ink)}
.cal button.m-休{background:var(--rest);color:var(--rest-ink)}
.cal button b{position:absolute;top:2px;right:5px;font-size:10px;font-weight:900}
.cal button i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.cm{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--chip);box-shadow:inset 0 0 0 1px var(--edge);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.cm.sel{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.sw.open{background:var(--ink)} .sw.cang{background:var(--cang)} .sw.rest{background:var(--rest)} .sw.none{background:var(--chip);box-shadow:inset 0 0 0 1px var(--edge)}
.legend{display:grid;gap:4px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:8px}
.preview{width:100%;border-radius:12px;border:1px solid var(--edge);display:block;margin-top:8px}
.plan{display:grid;grid-template-columns:1fr 78px 78px 28px;gap:6px;align-items:end}
.theme{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc{display:flex;gap:10px;align-items:center;background:var(--chip);border-radius:12px;padding:8px 10px;cursor:pointer}
.tc input{width:38px;height:38px;border:0;padding:0;background:none;border-radius:10px;flex:none;cursor:pointer}
.tc b{display:block;font-size:14px}.tc small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.banners{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bn{display:grid;gap:6px;align-content:start}
.bn b{font-size:13.5px;display:block}.bn small{font-size:11px;color:var(--muted);display:block;line-height:1.3;min-height:2.6em}
.bn img,.bn-empty{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:10px;border:1px solid var(--edge);display:block}
.bn-empty{background:var(--sage);display:grid;place-content:center;text-align:center;font-weight:900;font-size:11px;line-height:1.1;letter-spacing:.1em}
.upl{display:inline-block;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Maimine 管理頁 <small>MAIMINE . STUDIO</small></h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="pane"><div class="loading">載入中…</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="cfm" id="cfm" hidden></div>
<div class="busy" id="busy"><span>處理中…</span></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbxPxZpN-_GW19fy5qL6mN-DXh78cEEJFmbC9EsBecf0c0hmxTGP1Ln6k57g6bXsmvR-aA/exec";

/* ======================================================================
   小工具
   ====================================================================== */
const WD = ["日","一","二","三","四","五","六"];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const P = ds => { const [y,m,d] = ds.split("-").map(Number); return new Date(y, m-1, d); };
const S8 = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const addM = (ds, months) => { const d = P(ds), whole = Math.trunc(months), frac = months - whole, day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+whole); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); if(frac) d.setDate(d.getDate() + Math.round(frac*30)); return S8(d); };
const addD = (ds, n) => { const d = P(ds); d.setDate(d.getDate()+n); return S8(d); };
const days = (a, b) => Math.round((P(b) - P(a)) / 86400000);
const fmt = ds => { const d = P(ds); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
const fmtW = ds => { const d = P(ds); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const money = n => (n < 0 ? "−$" : "$") + Math.abs(Number(n)||0).toLocaleString();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fill = (t, o) => String(t).replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
const hoursBetween = (a, b) => { const [h1,m1] = a.split(":").map(Number), [h2,m2] = b.split(":").map(Number); return Math.round(((h2*60+m2) - (h1*60+m1)) / 30) / 2; };
const TIMES = []; for(let m = 10*60; m <= 21*60; m += 30) TIMES.push(pad(Math.floor(m/60)) + ":" + pad(m%60));
const ACTIVE = ["待確認","待付定金","已預約"];
function toast(t, err){ const el = $("toast"); el.textContent = t; el.className = "toast" + (err ? " err" : ""); el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", err ? 5000 : 3000); }
function applyTheme(t){ if(!t) return; const r = document.documentElement.style; ["paper","sage","pill","ink"].forEach(k => { if(/^#[0-9a-fA-F]{6}$/.test(t[k]||"")) r.setProperty("--"+k, t[k]); }); }

/* ======================================================================
   資料
   ====================================================================== */
let DATA = null;
const UI = { tab:"book", bview:"todo", forms:{}, open:null, editing:null, edraft:null, paste:"", linking:null, linkPick:null, linkQ:null,
  refPick:null, refQ:"", refSet:{}, detail:null, editC:null, q:"", filter:"all", addCust:false, acctM:null, range:"m", from:"", to:"", showImg:null, addBk:false,
  curMonth:null, draft:null, calMode:"open", cfg:null };
const today = () => DATA.today;
const CFG = () => DATA.cfg;
const SETT = () => DATA.settings;
const custOf = id => DATA.customers.find(c => c.id === id);
const custName = id => (custOf(id) || {}).name || "";
const visitsOf = cid => DATA.visits.filter(v => v.cid === cid);
const isNewCust = c => !c || !visitsOf(c.id).some(v => v.kind === "施作");
const pkgOptions = () => [{ paid:CFG().trialPrice, months:0, label:"單次" }].concat(CFG().addons.map(a => ({ paid:CFG().trialPrice + a.add, months:a.months, label:`含 ${a.months} 個月補色券` })));
const locOf = name => CFG().locations.find(l => l.name === name) || CFG().locations[0] || { name, address:"", rooms:[] };
const addrOf = loc => (locOf(loc) || {}).address || SETT().addresses[loc] || "";
const bdayTxt = c => { if(!c.bday) return ""; const [,m,d] = c.bday.split("-").map(Number); return `${m}/${d}`; };
const bdayThisMonth = (c, on) => c.bday && c.bday.slice(5,7) === on.slice(5,7);
const findRef = x => { if(!x) return null; const k = String(x).trim().toUpperCase(), dg = k.replace(/\D/g,""); return DATA.customers.find(c => c.code === k) || (/^09\d{8}$/.test(dg) ? DATA.customers.find(c => c.phone === dg) : null); };
function refOf(b, c){
  if(b.service === "補色" || !isNewCust(c)) return null;
  if(b.id in UI.refSet) return UI.refSet[b.id] ? custOf(UI.refSet[b.id]) : null;
  if(b.refId) return custOf(b.refId) || null;
  const r = findRef(b.referrer); return r && (!c || r.id !== c.id) ? r : null;
}

/* 補色券、續補、抵用金（跟預約頁同一套算法） */
const lastTreat = cid => visitsOf(cid).filter(v => v.kind === "施作").sort((a,b) => b.date.localeCompare(a.date))[0];
function touchup(cid, on){
  const v = lastTreat(cid);
  if(!v) return { price:null, tag:"新客", why:"沒有施作紀錄，依當時價格計算" };
  const months = Number(v.months)||0, base = Number(v.base)||CFG().trialPrice, value = (Number(v.paid)||0) - base, again = Number(v.again) || (months ? CFG().againWith : CFG().againWithout);
  const yearEnd = addM(v.date, 12), freeEnd = months ? addM(v.date, months) : null;
  const o = { v, yearEnd, freeEnd, months, base, value, again };
  if(months && !v.voucherUsed){
    if(on <= freeEnd) return { ...o, price:0, tag:"補色券", why:`${fmt(v.date)} 施作購買的補色券，${fmt(freeEnd)} 前免費使用`, useVoucher:true };
    if(on <= yearEnd) return { ...o, price:Math.max(0, again - value), tag:"補色券逾期・補差價", why:`補色券已在 ${fmt(freeEnd)} 到期，${fmt(yearEnd)} 前補差價 ${money(again - value)} 即可使用`, useVoucher:true };
    return { ...o, price:Math.max(0, base - value), tag:"補色券逾期・補差價", why:`已超過 ${fmt(yearEnd)}，補差價 ${money(base - value)} 即可使用（依 ${fmt(v.date)} 購買時的體驗價 ${money(base)} 計算）`, useVoucher:true };
  }
  if(on <= yearEnd) return { ...o, price:again, tag:"續補優惠", why:`${fmt(yearEnd)} 前補色，每次 ${money(again)}` };
  return { ...o, price:null, tag:"重新施作", why:`已超過 ${fmt(yearEnd)}，視為重新施作，依當時價格計算` };
}
function credit(c, on){
  const bal = Number(c.credit)||0;
  if(!bal || !c.creditExp) return { bal:0, exp:null };
  if(on > c.creditExp) return { bal:0, exp:c.creditExp, lost:bal };
  return { bal, exp:c.creditExp };
}

/* ======================================================================
   跟後台溝通
   ====================================================================== */
async function api(action, data, quiet){
  if(!quiet) $("busy").classList.add("show");
  try{
    const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, data || {})) });
    const j = await r.json();
    if(j.conflict){
      $("busy").classList.remove("show");
      if(confirm(j.error)) return api(action, Object.assign({}, data, { force:true }), quiet);
      throw new Error("沒有變更");
    }
    if(!j.ok) throw new Error(j.error || "操作失敗");
    if(j.bookings && DATA) Object.assign(DATA, j);
    return j;
  } finally { $("busy").classList.remove("show"); }
}
async function run(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); render(); }
  catch(err){ toast(err.message, true); }
}

async function boot(){
  try{
    const pub = await (await fetch(API)).json();
    const id = pub.liff && pub.liff.admin;
    if(!id){ $("pane").innerHTML = `<div class="loading">還沒設定管理頁的 LIFF ID（ADMIN_LIFF_ID）。</div>`; return; }
    await liff.init({ liffId: id });
    if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    DATA = await api("adminLoad", {}, true);
    applyTheme(SETT().theme);
    render();
  }catch(err){ $("pane").innerHTML = `<div class="loading">載入失敗：${esc(err.message)}</div>`; }
}

function render(){

  const todo = DATA.bookings.filter(b => b.status === "待確認" || b.status === "待付定金").length;

/* ======================================================================
   傳 LINE 前先確認
   msgs = [{ to, tag, text, buttons, line }]；按確認才會 onSend(改過的文字)
   ====================================================================== */
function confirmSend(msgs, also, onSend){
  const box = $("cfm"), texts = msgs.map(m => m.text), editing = {};
  const any = msgs.some(m => m.line !== false);
  const draw = () => {
    box.innerHTML = `<div class="sheet"><h3>${any ? "確認要傳出的 LINE" : "確認一下"}</h3>${any ? `<p class="hint" style="margin:0">LINE 傳出去就不能收回，看一下內容對不對。可以直接改文字。</p>` : ""}
      ${msgs.map((m,i) => `<div class="to"><span>傳給 ${esc(m.to)}</span>${m.line === false ? "" : `<button type="button" class="mini" data-cfe="${i}">${editing[i] ? "完成" : "✏️ 改文字"}</button>`}</div>` +
        (m.line === false ? `<div class="nol">⚠️ ${esc(m.to)} 沒有綁定 LINE，不會傳出，記得自己告訴她</div>` :
        `<div class="chat"><div class="ban">${esc(m.tag)}</div>${editing[i] ? `<textarea data-cft="${i}">${esc(texts[i])}</textarea>` : `<div class="bubble">${esc(texts[i])}</div>`}${(m.buttons||[]).length ? `<div class="bb">${m.buttons.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}</div>`)).join("")}
      ${also && also.length ? `<div class="also"><b>同時會：</b><br>${also.map(a => "・" + esc(a)).join("<br>")}</div>` : ""}
      <button type="button" class="btn" id="cfm-ok" style="margin-top:14px">${any ? "確認，傳出去" : "確認"}</button>
      ${any ? `<button type="button" class="btn g" id="cfm-q">照做，但不傳 LINE</button>` : ""}
      <button type="button" class="btn g" id="cfm-x">先不要，回去改</button></div>`;
    box.querySelectorAll("[data-cft]").forEach(x => x.oninput = () => { texts[Number(x.dataset.cft)] = x.value; });
    box.querySelectorAll("[data-cfe]").forEach(x => x.onclick = () => { const i = x.dataset.cfe; editing[i] = !editing[i]; draw(); });
    $("cfm-x").onclick = () => { box.hidden = true; toast("還沒傳，也沒有改任何東西"); };
    $("cfm-ok").onclick = () => { box.hidden = true; onSend(texts, false); };
    if($("cfm-q")) $("cfm-q").onclick = () => { if(!confirm("確定只改資料、不傳 LINE 給客人嗎？")) return; box.hidden = true; onSend(texts.map(() => ""), true); };
  };
  draw(); box.hidden = false; box.scrollTop = 0;
}

function formOf(b){
  if(!UI.forms[b.id]){
    const s = b.studio, picked = Number(b.price) || 0, pk = pkgOptions().find(p => p.paid === picked) || pkgOptions()[0];
    if(s && s.room) UI.forms[b.id] = { loc:s.loc || b.loc, room:s.room, hours:Number(s.hours)||3, rent:Number(s.rent)||0, paid:pk.paid, credit:null, items:[], deposit:SETT().deposit, fromStudio:true };
    else {
      const loc = locOf(b.loc), r = loc.rooms[0] || { name:"", rate:0 };
      UI.forms[b.id] = { loc:loc.name, room:r.name, hours:3, rent:Math.round(r.rate*3), paid:pk.paid, credit:null, items:[], deposit:SETT().deposit };
    }
  }
  return UI.forms[b.id];
}
const hasStudio = s => !!(s && (s.room || s.code || s.link || s.img || s.start));
function needsLink(b, c){ return b.service === "補色" && !b.linkOk && !(c && visitsOf(c.id).length); }

function adminBook(){
  const on = today();
  const sorted = list => list.sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
  const todo = sorted(DATA.bookings.filter(b => b.status === "待確認" || b.status === "待付定金"));
  const up = sorted(DATA.bookings.filter(b => b.status === "已預約"));
  const done = DATA.bookings.filter(b => ["已完成","已婉拒","已取消"].includes(b.status)).sort((a,b) => (b.date+b.start).localeCompare(a.date+a.start));
  const chips = [["todo",`待處理 ${todo.length}`],["agenda",`行程 ${up.length}`],["done","已結束"]].map(([k,t]) => `<button type="button" class="chip${UI.bview===k?" sel":""}" data-bv="${k}">${t}</button>`).join("");
  let body = "";
  if(UI.bview === "agenda"){
    const ds = [...new Set(up.map(b => b.date))];
    body = ds.map(d => {
      const label = d === on ? "今天" : d === addD(on,1) ? "明天" : d < on ? "還沒結帳" : "";
      return `<div class="sec">${fmtW(d)}${label ? `　<span style="color:${d < on ? "var(--warn)" : "var(--ink)"}">${label}</span>` : ""}</div>` + up.filter(b => b.date === d).map(b => bkCard(b, on, true)).join("");
    }).join("") || `<div class="empty">接下來沒有預約</div>`;
  } else if(UI.bview === "todo"){
    body = todo.map(b => bkCard(b, on, false)).join("") || `<div class="empty">沒有要處理的預約 🎉</div>`;
  } else {
    body = done.slice(0, 60).map(b => `<div class="card"><div class="bk-top"><div><b class="bk-time">${fmtW(b.date)} ${b.start}</b><div class="bk-name">${esc(b.name)}<span class="meta">・${esc(b.service)}${b.status === "已完成" ? `・實收 ${money(b.revenue)}` : ""}</span></div></div><span class="pill s">${b.status}</span></div></div>`).join("") || `<div class="empty">還沒有</div>`;
  }
  $("pane").innerHTML = `<div class="top"><h2>預約</h2><button type="button" class="chip dark" id="addbk">＋ 新增預約</button></div>
    ${UI.addBk ? addBkForm() : ""}<div class="chips" style="margin-top:6px">${chips}</div>${body}`;
  $("pane").querySelectorAll("[data-bv]").forEach(x => x.onclick = () => { UI.bview = x.dataset.bv; UI.open = null; UI.editing = null; render(); });
  $("addbk").onclick = () => { UI.addBk = !UI.addBk; render(); };
  if(UI.addBk) wireAddBk();
  wireBk(); wireCheckout();
}

function wireAddBk(){
  $("ab-x").onclick = () => { UI.addBk = false; render(); };

    const d = { date:$("ab-date").value, start:$("ab-start").value, loc:$("ab-loc").value, status:$("ab-status").value, name:$("ab-name").value.trim(),

function bkCard(b, on, inAgenda){
  const c = custOf(b.cid);
  if(needsLink(b, c)) return linkCard(b, c, on);
  const ref = refOf(b, c), s = b.studio || null;
  const tags = ref ? `<span class="tag warn">推薦人 ${esc(ref.name)}</span>` : isNewCust(c) && b.service !== "補色" ? `<span class="tag g">新客</span>${b.referrer && !(b.id in UI.refSet) ? `<span class="tag warn">推薦人「${esc(b.referrer)}」找不到</span>` : ""}` : "";
  const pill = b.status === "待確認" ? '<span class="pill w">待確認</span>' : b.status === "待付定金" ? '<span class="pill s">待付定金</span>' : (hasStudio(s) ? "" : '<span class="pill w">還沒訂工作室</span>');
  let html = `<div class="card"><div class="bk-top"><div><b class="bk-time">${inAgenda ? "" : fmtW(b.date) + " "}${b.start}</b><div class="bk-name">${esc(b.name)}${b.phone ? `<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>` : ""}<br><span class="meta">${esc(itemOf(b))}・${esc(b.loc)}${b.source === "手動" ? "・手動新增" : ""}${b.lineName ? `・LINE：${esc(b.lineName)}` : ""}</span>${tags}</div></div>${pill}</div>`;
  if(b.memo) html += `<div class="note">💬 ${esc(b.memo)}</div>`;
  if(hasStudio(s)) html += `<div class="stl">📍 ${esc(s.loc || b.loc)}${s.room ? "・" + esc(s.room) : ""}${s.start ? `　${esc(s.start)}–${esc(s.end)}` : `　${s.hours} 小時`}${s.code ? `　🔑 <b>${esc(s.code)}</b>` : ""}${s.stale ? `<div class="warn-t">⚠️ 預約時間改過，記得確認工作室</div>` : ""}${s.note ? `<div class="meta">📝 ${esc(s.note)}</div>` : ""}</div>`;
  if(b.status === "待付定金" && b.confirmedAt){
    const t = b.confirmedAt, due = new Date(P(t.slice(0,10)).getTime() + (Number(t.slice(11,13))*60 + Number(t.slice(14,16)))*60000 + SETT().payHours*3600000);
    html += `<p class="meta" style="margin:6px 0 0">等定金 ${money(SETT().deposit)}・期限 ${due.getMonth()+1}/${due.getDate()} ${pad(due.getHours())}:${pad(due.getMinutes())}</p>`;
  }
  if(UI.editing === b.id) return html + editForm(b) + `</div>`;
  if(UI.open === b.id) return html + checkoutForm(b, c) + `</div>`;
  const acts = [];
  if(b.status === "待確認") acts.push(`<button type="button" class="btn" data-ok="${b.id}">確認</button>`);
  if(b.status === "待付定金") acts.push(`<button type="button" class="btn" data-paid="${b.id}">已收定金</button>`);
  if(b.status === "已預約" && b.date <= on) acts.push(`<button type="button" class="btn" data-open="${b.id}">結帳</button>`);
  if(s && s.link) acts.push(`<a class="btn g" href="${esc(s.link)}" target="_blank" rel="noopener">入場 QR</a>`);
  if(s && s.img) acts.push(`<button type="button" class="btn g" data-img="${b.id}">截圖</button>`);
  acts.push(`<button type="button" class="btn g" data-ed="${b.id}">✏️ 編輯</button>`);
  html += `<div class="acts">${acts.join("")}</div>`;
  if(UI.showImg === b.id && s && s.img) html += `<img class="shot" src="${esc(s.img)}" alt="工作室預約截圖">`;
  return html + `</div>`;
}

function linkCard(b, c, on){
  const head = `<div class="bk-top"><div><b class="bk-time">${fmtW(b.date)} ${b.start}</b><div class="bk-name">${esc(b.name)}<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><br><span class="meta">補色・${esc(b.loc)}</span></div></div><span class="pill w">${b.status}</span></div>`;
  if(UI.linking === b.id){
    const q = UI.linkQ ?? b.name.slice(0,1);
    const res = q ? DATA.customers.filter(x => x.id !== b.cid && visitsOf(x.id).length && [x.name, x.ig, x.phone, x.code].join(" ").includes(q)) : [];
    return `<div class="card">${head}<div class="note">搜尋她的舊紀錄（你補登過的客人）：</div>
      <input class="fld" id="linkq" value="${esc(q)}" style="margin-top:8px" placeholder="姓名、IG、手機">

function changesOf(b, d){
  const out = [];
  if(d.date !== b.date) out.push(["日期", fmtW(b.date), fmtW(d.date)]);
  if(d.start !== b.start) out.push(["時間", b.start, d.start]);
  if(d.loc !== b.loc) out.push(["地點", b.loc, d.loc]);
  if(d.service !== b.service) out.push(["項目", b.service, d.service]);
  return out;
}
function parseStudioMsg(t){
  const o = {}; let m;
  if(m = t.match(/房間名稱[：:]\s*([^$，,\n]+?)\s*\$\s*(\d+)\s*\/\s*時/) || t.match(/房間名稱[：:]\s*([^\s$，,]+)/)) { o.room = m[1].trim(); if(m[2]) o.rate = Number(m[2]); }
  if(m = t.match(/地址[：:]\s*([^，,\n]+?)(?=[，,\n]|詳細|預約時段|$)/)) o.address = m[1].trim();
  if(m = t.match(/預約時段[：:]\s*(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\s+(\d{1,2}:\d{2})\s*[-–~～]\s*(\d{1,2}:\d{2})/)) { o.date = `${m[1]}-${pad(m[2])}-${pad(m[3])}`; o.start = m[4].padStart(5,"0"); o.end = m[5].padStart(5,"0"); }
  if(m = t.match(/(?:門鎖)?密碼[：:]\s*([0-9A-Za-z#*]+)/)) o.code = m[1];
  if(m = t.match(/https?:\/\/[^\s，,]+/)) o.link = m[0];
  return o;
}

    `<div class="g3"><div><span class="lab">工作室</span><select class="fld" data-f="loc" data-b="${b.id}">${CFG().locations.map(l => `<option${l.name===f.loc?" selected":""}>${esc(l.name)}</option>`).join("")}</select></div>

  let lines = [], subtotal, cBal = c ? credit(c, on).bal : 0;

    lines.push(["包套", f.paid]);

    const t = touchup(c ? c.id : "", on);

      refHtml = `<span class="lab">推薦人<small>搜尋姓名、IG、手機或推薦碼</small></span><input class="fld" id="refq" value="${esc(q)}" placeholder="例：小琪">

function complete(b){

    await api("adminComplete", { id:b.id, f:{ kind: isTreat ? "施作" : "補色", paid:f.paid, months: opt ? opt.months : 0, price: isTreat ? "" : f.subtotal,

      msgs:[ to && t[0] ? { text:t[0], tag } : null, r && r.userId && t[1] ? { text:t[1], tag:"推薦成功" } : null ] });

function voucherCard(c, on){
  const t = touchup(c.id, on), v = t.v;
  if(!v) return "";
  let main, fine = [];
  if(t.months && !v.voucherUsed){
    main = `<div class="hl${on <= t.freeEnd ? "" : " off"}"><span>補色券 1 張</span><b>${fmt(t.freeEnd)} 前來補色：免費</b></div>`;
    if(t.freeEnd < t.yearEnd) fine.push(`${fmt(addD(t.freeEnd,1))}～${fmt(t.yearEnd)}：補差價 ${money(t.again - t.value)}`);
    fine.push(`${fmt(addD(t.yearEnd,1))} 起：補差價 ${money(t.base - t.value)}`);
    fine.push(`續補優惠：${fmt(t.yearEnd)} 前，每次 ${money(t.again)}`);
  } else if(t.months){
    main = `<div class="hl off"><span>補色券</span><b>已使用（${v.usedOn ? fmt(v.usedOn) : ""}）</b></div>`;
    fine.push(`續補優惠：${fmt(t.yearEnd)} 前，每次 ${money(t.again)}`);
  } else {
    main = `<div class="hl"><span>續補優惠</span><b>${fmt(t.yearEnd)} 前補色 ${money(t.again)}</b></div>`;
  }
  return `<div class="card"><div class="top"><span class="pill">${t.months ? "補色券" : "補色優惠"}</span><span class="meta">${fmt(v.date)} 施作・${money(v.paid)}${v.source === "補登" ? "・補登" : ""}</span></div>${main}<ul class="fine">${fine.map(x => `<li>${x}</li>`).join("")}</ul>
    <div class="note ${t.price===0?"ok":""}">今天補色：<b>${t.price===null?"依當時價格":t.price===0?"免費":money(t.price)}</b><span class="tag g">${esc(t.tag)}</span></div></div>`;
}
function creditCard(c, on){
  const cr = credit(c, on);
  let body;
  if(cr.lost) body = `<div class="big" style="color:#A9ABA3">$0</div><div class="note warn">原本的 ${money(cr.lost)} 已在 ${fmt(cr.exp)} 到期</div>`;
  else if(!cr.bal) body = `<div class="big">$0</div>`;
  else { const left = days(on, cr.exp); body = `<div class="big">${money(cr.bal)}</div><div class="rows"><span>有效至</span><span>${fmt(cr.exp)}${left <= 62 ? `<span class="tag warn">剩 ${left} 天</span>` : ""}</span></div>`; }
  return `<div class="card"><div class="top"><span class="pill s">抵用金</span></div>${body}</div>`;
}
function timeline(c){
  const ev = [];
  visitsOf(c.id).forEach(v => {
    let s = v.kind === "施作" ? (Number(v.months) ? `含補色券（${v.months} 個月）` : "單次") : (Number(v.price) === 0 ? "使用補色券・$0" : `補色 ${money(v.price)}`);
    s += `・實收 ${money(v.revenue)}`;
    if(v.kind === "施作") s += `・體驗價 ${money(v.base)} 鎖定`;
    if(v.loc) s += `・${v.loc}${v.room ? " " + v.room : ""}${v.rent ? " 租金 " + money(v.rent) : ""}`;
    ev.push({ d:v.date, t:`${v.kind === "施作" ? esc(v.service) + "・" + money(v.paid) : "補色"}<span class="src">${v.source === "補登" ? "補登" : v.source === "手動" ? "手動" : "線上預約"}</span>`, s });
  });
  DATA.creditLog.filter(x => x.cid === c.id).forEach(x => ev.push({ d:x.date, t:x.amt > 0 ? `抵用金 +${money(x.amt)}` : `抵用金 ${money(x.amt)}`, s:x.why }));
  ev.sort((a,b) => b.d.localeCompare(a.d));
  return ev.length ? `<div class="tl">${ev.map(e => `<div class="ti"><div class="d">${fmt(e.d)}</div><div class="t">${e.t}</div><div class="s">${esc(e.s)}</div></div>`).join("")}</div>` : `<div class="empty">還沒有紀錄</div>`;
}

function rangeOf(k, on){
  const m0 = on.slice(0,7) + "-01", endOfMonth = ds => addD(addM(ds.slice(0,7)+"-01", 1), -1);
  if(k === "m") return [m0, endOfMonth(on)];
  if(k === "pm"){ const p = addM(m0, -1); return [p, endOfMonth(p)]; }
  if(k === "3m") return [addM(m0, -2), endOfMonth(on)];
  if(k === "y") return [on.slice(0,4)+"-01-01", on.slice(0,4)+"-12-31"];
  return [UI.from || addM(m0,-2), UI.to || endOfMonth(on)];
}

        <span class="lab">房間<small>名稱・每小時租金</small></span>${l.rooms.map((r,ri) => `<div class="room" style="grid-template-columns:1fr 90px 26px"><input data-rm="${li}-${ri}" data-k="name" value="${esc(r.name)}" aria-label="房間"><input data-rm="${li}-${ri}" data-k="rate" inputmode="numeric" value="${r.rate}" aria-label="時租"><button type="button" class="x" data-rmrm="${li}-${ri}" aria-label="刪除">×</button></div>`).join("")}
        <button type="button" class="mini" data-addrm="${li}">＋ 新增房間</button></div>`).join("")}
      <button type="button" class="btn g" id="addloc">＋ 新增工作室</button></div>
    <div class="card"><b>支出分類</b><input class="fld" id="cats" value="${esc(C.expenseCats.join("、"))}" style="margin-top:6px"><p class="fine2">用「、」隔開</p></div>
    <div class="card"><div class="top"><b>生日祝福</b><label class="chk" style="margin:0"><input type="checkbox" id="bdon"${C.bdayOn ? " checked" : ""}>${C.bdayOn ? "開啟中" : "已關閉"}</label></div>
      <p class="hint" style="margin:4px 0 6px">${C.bdayOn ? "客人生日當天早上 10 點會自動收到這則 LINE（有填生日、有綁 LINE 的客人）" : "關閉時不會傳任何生日訊息；客人的生日還是會照常記錄"}</p>
      <textarea class="fld" data-cs="bdayText" style="min-height:80px">${esc(C.bdayText)}</textarea></div>
    <div class="card"><b>收款資訊</b><p class="hint" style="margin:2px 0 6px">按「確認」時，這段文字會放進訊息裡，收款碼會另外傳一張圖。</p>
      <textarea class="fld" id="s-pay" placeholder="街口支付：掃下方收款碼">${esc(S.payInfo)}</textarea>
      ${S.payImage ? `<img class="preview" src="${esc(S.payImageUrl)}" alt="收款碼" style="max-width:200px">` : ""}
      <div class="btns"><label class="btn g upl" for="s-file">${S.payImage ? "換收款碼" : "上傳收款碼"}</label><input type="file" id="s-file" accept="image/*" hidden>${S.payImage ? `<button type="button" class="btn g" id="s-rmimg">移除</button>` : ""}</div></div>
    <div class="card"><b>整體配色</b><p class="hint" style="margin:2px 0 8px">預約頁、管理頁和 LINE 卡片會一起換顏色。</p>
      <div class="theme">${THEME_FIELDS.map(([k,t,d]) => `<label class="tc"><input type="color" id="t-${k}" value="${esc(S.theme[k])}"><span><b>${t}</b><small>${d}</small></span></label>`).join("")}</div>
      <button type="button" class="mini" id="t-reset">恢復海報配色</button></div>
    <div class="card"><b>LINE 訊息橫幅</b><p class="hint" style="margin:2px 0 0">建議 2:1 的圖。沒上傳的會用主色色塊代替。上傳後馬上生效。</p>
      <div class="banners">${BANNER_FIELDS.map(([k,d]) => { const bn = (S.banners||{})[k] || {}; return `<div class="bn"><div><b>${k}</b><small>${d}</small></div>
        ${bn.url ? `<img src="${esc(bn.url)}" alt="${k}的橫幅">` : `<div class="bn-empty">MAIMINE<br>STUDIO</div>`}
        <div><label class="mini upl" for="bn-${k}">${bn.url ? "換圖" : "上傳"}</label><input type="file" id="bn-${k}" data-bn="${k}" accept="image/*" hidden>${bn.url ? `　<button type="button" class="mini" style="color:var(--red)" data-bnrm="${k}">移除</button>` : ""}</div></div>`; }).join("")}</div></div>
    <details class="adv"><summary>進階：提醒時間和 LINE 文字</summary>
      <div class="set">
        <span>補色券到期前幾個月提醒</span><input data-rem="voucherMonths" value="${C.remind.voucherMonths}">
        <span>續補優惠到期前幾個月提醒</span><input data-rem="yearMonths" value="${C.remind.yearMonths}">
        <span>抵用金到期前幾個月提醒<br><small class="meta">可以填兩個，用「、」隔開</small></span><input data-rem="creditMonths" value="${C.remind.creditMonths.join("、")}"></div>
      ${[["voucher","補色券提醒"],["year","續補優惠提醒"],["credit","抵用金提醒"],["reward","推薦成功通知"]].map(([k,t]) => `<span class="lab">${t}</span><textarea class="fld" data-tx="${k}">${esc(C.texts[k])}</textarea>`).join("")}
      <p class="fine2" style="margin-bottom:10px">{name} 客人名字、{date} 日期、{amount} 金額、{friend} 朋友名字、{reward} 回饋金額、{months} 抵用金期限月數</p></details>
    <button type="button" class="btn" id="save-set" style="margin-top:14px">儲存設定</button>
    <p class="fine2">時段範圍、提前天數、定金金額、預約項目，在 Google 試算表的「其他設定」分頁裡改。</p>`;
  const pane = $("pane");
  pane.querySelectorAll("[data-c]").forEach(x => x.onchange = () => { C[x.dataset.c] = Number(x.value.replace(/\D/g,"")) || 0; render(); });
  pane.querySelectorAll("[data-cs]").forEach(x => x.oninput = () => { C[x.dataset.cs] = x.value; });
  pane.querySelectorAll("[data-ad]").forEach(x => x.onchange = () => { C.addons[x.dataset.ad][x.dataset.k] = Number(x.value) || 0; render(); });
  pane.querySelectorAll("[data-rmad]").forEach(x => x.onclick = () => { C.addons.splice(Number(x.dataset.rmad),1); render(); });
  $("addad").onclick = () => { C.addons.push({ add:2000, months:6 }); render(); };
  pane.querySelectorAll("[data-ln]").forEach(x => x.oninput = () => { C.locations[x.dataset.ln].name = x.value.trim(); });
  pane.querySelectorAll("[data-la]").forEach(x => x.oninput = () => { C.locations[x.dataset.la].address = x.value.trim(); });
  pane.querySelectorAll("[data-rm]").forEach(x => x.oninput = () => { const [li,ri] = x.dataset.rm.split("-").map(Number), r = C.locations[li].rooms[ri]; r[x.dataset.k] = x.dataset.k === "rate" ? Number(x.value) || 0 : x.value; });
  pane.querySelectorAll("[data-rmrm]").forEach(x => x.onclick = () => { const [li,ri] = x.dataset.rmrm.split("-").map(Number); C.locations[li].rooms.splice(ri,1); render(); });
  pane.querySelectorAll("[data-addrm]").forEach(x => x.onclick = () => { C.locations[Number(x.dataset.addrm)].rooms.push({ name:"", rate:0 }); render(); });
  pane.querySelectorAll("[data-rmloc]").forEach(x => x.onclick = () => { const l = C.locations[Number(x.dataset.rmloc)]; if(confirm(`刪除「${l.name}」？已經約在這裡的預約不受影響。`)){ C.locations.splice(Number(x.dataset.rmloc),1); render(); } });
  $("addloc").onclick = () => { C.locations.push({ name:"新工作室", address:"", rooms:[{ name:"", rate:0 }] }); render(); };
  $("cats").oninput = e => { C.expenseCats = e.target.value.split(/[、,，]/).map(s => s.trim()).filter(Boolean); };
  $("bdon").onchange = e => { C.bdayOn = e.target.checked; render(); };
  pane.querySelectorAll("[data-rem]").forEach(x => x.oninput = () => { const k = x.dataset.rem; C.remind[k] = k === "creditMonths" ? x.value.split(/[、,，]/).map(Number).filter(Boolean) : Number(x.value) || 0; });
  pane.querySelectorAll("[data-tx]").forEach(x => x.oninput = () => { C.texts[x.dataset.tx] = x.value; });
  THEME_FIELDS.forEach(([k]) => $("t-"+k).oninput = () => { const t = {}; THEME_FIELDS.forEach(([k2]) => t[k2] = $("t-"+k2).value); applyTheme(t); });
  $("t-reset").onclick = () => { Object.keys(THEME_DEFAULT).forEach(k => $("t-"+k).value = THEME_DEFAULT[k]); applyTheme(THEME_DEFAULT); toast("按「儲存設定」才會套用到全部"); };
  $("s-file").onchange = async e => { const f = e.target.files[0]; if(!f) return;
    try{ const data = await resizeImage(f, 900, 0.92); const j = await api("adminUpload", { data, mime:"image/jpeg", name:"pay-qr.jpg" }); const r = await api("adminSaveSettings", { settings:{ payImage:j.id } }); DATA.settings = r.settings; render(); toast("收款碼已更新"); }
    catch(err){ toast(err.message, true); } };
  if($("s-rmimg")) $("s-rmimg").onclick = () => run(async () => { const r = await api("adminSaveSettings", { settings:{ payImage:"" } }); DATA.settings = r.settings; }, "已移除");
  pane.querySelectorAll("[data-bn]").forEach(inp => inp.onchange = async e => { const f = e.target.files[0], k = inp.dataset.bn; if(!f) return;
    try{ const data = await resizeImage(f, 1040, 0.88); const j = await api("adminUpload", { data, mime:"image/jpeg", name:`banner-${k}.jpg` }); const r = await api("adminSaveSettings", { settings:{ banners:{ [k]: j.id } } }); DATA.settings = r.settings; render(); toast(`「${k}」橫幅已更新`); }
    catch(err){ toast(err.message, true); } });
  pane.querySelectorAll("[data-bnrm]").forEach(b => b.onclick = () => run(async () => { const r = await api("adminSaveSettings", { settings:{ banners:{ [b.dataset.bnrm]: "" } } }); DATA.settings = r.settings; }, "已移除"));
  $("save-set").onclick = () => {
    if(C.locations.some(l => !l.name)){ toast("工作室名稱不能空白", true); return; }
    const handle = String(C.igHandle || "").replace(/^@/, "").trim(); C.igHandle = handle; if(handle) C.igUrl = "https://instagram.com/" + handle;
    const theme = {}; THEME_FIELDS.forEach(([k]) => theme[k] = $("t-"+k).value);
    const payInfo = $("s-pay").value;
    run(async () => { await api("adminSaveCfg", { cfg:C }); const r = await api("adminSaveSettings", { settings:{ payInfo, theme } }); DATA.settings = r.settings; applyTheme(r.settings.theme); UI.cfg = null; }, "已儲存");
  };
}

/* ---------- 圖片壓縮 ---------- */
function resizeImage(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => { const sc = Math.min(1, maxW / img.width), c = document.createElement("canvas");
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality).split(",")[1]); };
      img.onerror = () => reject(new Error("這張圖片讀不到，換一張試試"));
      img.src = fr.result; };
    fr.onerror = () => reject(new Error("這張圖片讀不到，換一張試試"));
    fr.readAsDataURL(file);
  });
}

boot();
</script>
