<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maimine Studio 線上預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 單一視覺世界：照海報的米白底、墨黑字、鼠尾草綠 */
  --paper:#F0EFEA;
  --ink:#161616;
  --sage:#9DAE92;
  --sage-deep:#6F8463;
  --pill:#DCE2D5;
  --chip:#ECEFE7;
  --muted:#6B6E66;
  --danger:#B4543F;
  --display:"Bagel Fat One","Noto Sans TC",system-ui,sans-serif;
  --hand:"Mali","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:0 18px 40px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--sage-deep);outline-offset:2px}

/* ---------- 海報頁首 ---------- */
.hero{margin:0 -18px}
.poster{margin:0}.poster img{width:100%;height:auto;display:block}
.hero svg.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.logo{position:relative;margin:10px 0 0;display:flex;justify-content:center}
.logo img{width:min(320px,82%);height:auto;display:block}
.blob{position:relative;margin:18px auto 0;width:min(340px,88%);aspect-ratio:340/170}
.blob svg{position:absolute;inset:0;width:100%;height:100%}
.blob .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.blob .month{font-family:var(--display);font-size:clamp(42px,12vw,56px);line-height:1}
.blob .sub{font-weight:900;font-size:clamp(17px,4.8vw,21px);letter-spacing:.08em}
.blob .sub::before{content:"\\ ";margin-right:.5em;font-weight:400}
.blob .sub::after{content:" /";margin-left:.5em;font-weight:400}

/* ---------- 區塊 ---------- */
section{margin-top:30px}
.step{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.step .n{font-family:var(--hand);font-weight:700;font-size:15px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:inline-grid;place-items:center;flex:none;transform:translateY(4px)}
.step h2{font-size:19px;font-weight:900;margin:0;text-wrap:balance}
.hint{font-size:14px;color:var(--muted);margin:0 0 12px}

.promo{background:var(--pill);border-radius:22px;padding:16px 18px;display:grid;gap:8px;margin-top:26px}
.promo .tag{font-family:var(--hand);font-weight:700;font-size:14px;background:var(--ink);color:var(--paper);border-radius:99px;padding:1px 12px;justify-self:start}
.promo .items{font-weight:900;font-size:18px}
.promo .row{display:flex;justify-content:space-between;gap:12px;font-size:15px;align-items:baseline}
.promo .price{font-family:var(--hand);font-weight:700;font-size:18px;white-space:nowrap}
.promo s{color:var(--muted);font-size:13px;margin-left:6px;font-family:var(--hand)}

/* ---------- 日期格 ---------- */
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dbtn{border:0;background:var(--pill);border-radius:16px;padding:9px 4px 7px;cursor:pointer;display:grid;gap:0;justify-items:center;line-height:1.15}
.dbtn .d{font-family:var(--hand);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.dbtn .w{font-size:12.5px;font-weight:700;color:var(--sage-deep)}
.dbtn .dots{display:flex;gap:4px;margin-top:5px}
.dbtn .dots i{width:6px;height:6px;border-radius:50%;background:var(--sage-deep)}
.dbtn:hover{background:#e9ede4}
.dbtn.sel{background:var(--ink);color:var(--paper)}
.dbtn.sel .w{color:var(--sage)}
.dbtn.sel .dots i{background:var(--sage)}
.sess{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;margin-bottom:12px}
.sess .lab{font-weight:900;font-size:16px;padding-top:8px}
.sess .lab small{display:block;font-weight:500;font-size:12px;color:var(--muted)}

/* ---------- 時間 / 地點選項 ---------- */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:0;background:var(--chip);box-shadow:inset 0 0 0 1px #cdd3c6;border-radius:14px;padding:8px 14px;font-family:var(--hand);font-weight:600;font-size:16px;cursor:pointer;font-variant-numeric:tabular-nums}
.opt small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500;line-height:1.2}
.opt.sel{background:var(--sage);box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt.zh{font-family:var(--body);font-weight:700;font-size:15px}
.note{margin-top:10px;font-size:14px;background:#fff8;border-left:4px solid var(--sage);border-radius:0 12px 12px 0;padding:8px 12px}
.placeholder{font-size:14px;color:var(--muted);background:var(--chip);border-radius:14px;padding:12px 14px}

/* ---------- 表單欄位 ---------- */
.field{display:grid;gap:4px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.field label .opt-l{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.field input,.field textarea{border:1.5px solid #c9cec2;background:#fbfbf8;border-radius:14px;padding:10px 14px;font-size:16px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.err{color:var(--danger);font-size:13px;min-height:0}
.price-line{font-size:14px;margin-top:8px;color:var(--muted)}
.price-line b{color:var(--ink);font-family:var(--hand);font-size:17px}

/* ---------- 術前須知 ---------- */
details.rules{background:#fbfbf8;border:1.5px solid #c9cec2;border-radius:18px;padding:0 16px}
details.rules summary{cursor:pointer;font-weight:900;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:"展開";font-size:13px;font-weight:500;color:var(--muted)}
details.rules[open] summary::after{content:"收合"}
.rules ol{margin:0 0 12px;padding-left:1.4em;font-size:14.5px;display:grid;gap:6px}
.rules h3{font-size:15px;margin:14px 0 6px}
.rules p{font-size:14.5px;margin:0 0 10px}
.checks{display:grid;gap:10px;margin-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;background:var(--chip);border-radius:14px;padding:10px 12px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--sage-deep);flex:none;margin-top:3px}
.check small{display:block;color:var(--muted);font-size:13px;margin-top:2px}

.submit{margin-top:22px;width:100%;border:0;border-radius:99px;background:var(--ink);color:var(--paper);font-weight:900;font-size:18px;padding:14px;cursor:pointer;letter-spacing:.06em}
.submit:hover{background:#333}
.deposit{text-align:center;font-size:13.5px;color:var(--muted);margin-top:10px}
.foot{margin-top:34px;text-align:center}
.foot .handle{display:inline-block;font-family:var(--hand);font-weight:700;letter-spacing:.14em;font-size:14px;border:1.5px solid var(--ink);border-radius:50%;padding:8px 26px}
.demo{font-size:12px;color:var(--muted);margin-top:14px}

/* ---------- 送出結果 ---------- */
.sheet{position:fixed;inset:0;background:#16161666;display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.show{display:flex}
.sheet .card{background:var(--paper);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:24px 22px 28px;max-height:90%;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1.1}
.sheet .status{display:inline-block;margin:10px 0 14px;background:var(--sage);border-radius:99px;padding:2px 14px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.sheet dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0;font-size:15px}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0;font-weight:700}
.sheet .next{margin-top:16px;font-size:14.5px;background:var(--chip);border-radius:16px;padding:12px 14px}
.sheet .next ol{margin:6px 0 0;padding-left:1.3em}
.sheet button{margin-top:18px}
@media (prefers-reduced-motion:no-preference){.chip,.opt{transition:background .15s}}

.mtitle{text-align:center;font-weight:900;font-size:20px;letter-spacing:.08em;margin:6px 0 0}
.mtabs{display:flex;gap:8px;justify-content:center;margin-top:16px}
.mtabs:empty{display:none}
.mtab{border:0;background:var(--pill);border-radius:99px;padding:6px 18px;font-weight:900;cursor:pointer}
.mtab.sel{background:var(--ink);color:var(--paper)}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.notes{white-space:pre-line;font-size:14.5px;padding-bottom:14px}
.submit:disabled{opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <div class="mtabs" id="mtabs"></div>
  <div id="loading" class="loading">載入中…</div>
  <div id="closed" class="placeholder" style="display:none;margin-top:24px">目前還沒有開放預約的時段，下個月的時段公布後再來看看喔！</div>

  <div id="main" style="display:none">
  <div class="promo" id="promo"></div>

  <form id="f" novalidate>
  <section>
    <div class="step"><span class="n">1</span><h2>選日期</h2></div>
    <p class="hint" id="advHint">需提前 7 天預約，下面是目前還能約的日子。</p>
    <div class="dgrid" id="days"></div>
  </section>

  <section>
    <div class="step"><span class="n">2</span><h2>選時間</h2></div>
    <div id="times"></div>
  </section>

  <section>
    <div class="step"><span class="n">3</span><h2>預約地點</h2></div>
    <div id="locs"></div>
  </section>

  <section>
    <div class="step"><span class="n">4</span><h2>預約項目</h2></div>
    <div class="opts" id="svc"></div>
    <div id="planWrap" style="margin-top:12px"><div class="opts" id="plan"></div></div>
    <div class="price-line" id="priceLine"></div>
  </section>

  <section>
    <div class="step"><span class="n">5</span><h2>你的資料</h2></div>
    <div class="field"><label for="name">姓名</label><input id="name" autocomplete="name" placeholder="王小美"><div class="err" id="e-name"></div></div>
    <div class="field"><label for="phone">手機</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="0912345678"><div class="err" id="e-phone"></div></div>
    <div class="field"><label for="memo">備註<span class="opt-l">選填，例如想調整時間、想要的眉型</span></label><textarea id="memo"></textarea></div>
  </section>

  <section>
    <div class="step"><span class="n">6</span><h2>術前須知</h2></div>
    <details class="rules" id="rules">
      <summary>請詳讀後再預約</summary>
      <div class="notes" id="notes"></div>
    </details>
    <div class="checks">
      <label class="check"><input type="checkbox" id="c-health"><span>我沒有術前須知中「無法施作」的任何狀況<small>不確定的話請先在備註寫下，麥會跟你確認</small></span></label>
      <label class="check"><input type="checkbox" id="c-agree"><span>我已詳閱術前須知，並同意遵守約定<small id="agreeSmall">包含定金與取消、改期的規定</small></span></label>
    </div>
    <div class="err" id="e-check"></div>
  </section>

  <div class="err" id="e-submit" style="margin-top:16px;font-size:14px"></div>
  <button class="submit" type="submit" id="submitBtn">送出預約申請</button>
  <p class="deposit" id="depositNote"></p>
  </form>
  </div>

  <footer class="foot"><span class="handle">· MAIMINE . STUDIO ·</span></footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="card">
    <h2 id="sheetTitle">Thank you!</h2>
    <span class="status">預約申請已送出・待確認</span>
    <dl id="summary"></dl>
    <div class="next"><b>接下來</b>
      <ol>
        <li>麥確認工作室有位後，會用 LINE 回覆最終時間和地點</li>
        <li id="nextDeposit">收到回覆後預付定金（施作當日折抵）</li>
        <li>付款完成，預約就成立囉</li>
      </ol>
    </div>
    <button class="submit" type="button" id="closeSheet">好的</button>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>

const WD = ["日","一","二","三","四","五","六"];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const toMin = s => { const [h,m] = String(s).split(":").map(Number); return h*60+(m||0); };
const toStr = m => pad(Math.floor(m/60))+":"+pad(m%60);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dateStr = (month,d) => `${month}-${pad(d)}`;
const wdOf = ds => { const [y,m,d] = ds.split("-").map(Number); return WD[new Date(y,m-1,d).getDay()]; };
const fmtDate = ds => { const [,m,d] = ds.split("-").map(Number); return `${m}/${d}（${wdOf(ds)}）`; };

let D = null, S = null, liffReady = false;
const state = { month:null, day:null, session:null, start:null, loc:null, svc:null, plan:null };

/* ---------- 時段規則（跟後台一樣） ---------- */
function startOptions(ds, session){
  const day = D.booked[ds] || {};
  let lo, hi;
  if(session === "early"){
    lo = toMin(S.early.from); hi = toMin(S.early.to);
    if(day.late){ const l = toMin(day.late.t); lo = Math.max(lo, l-S.gapMax); hi = Math.min(hi, l-S.gapMin); }
  } else {
    lo = toMin(S.late.aloneFrom); hi = toMin(S.late.to);
    if(day.early){ const e = toMin(day.early.t); lo = Math.max(toMin(S.late.from), e+S.gapMin); hi = Math.min(hi, e+S.gapMax); }
  }
  const out = []; for(let m=lo; m<=hi; m+=S.step) out.push(m); return out;
}
const sessAvail = (ds,s) => !(D.booked[ds]||{})[s] && startOptions(ds,s).length > 0;
const dayAvail = ds => ds >= D.minDate && (sessAvail(ds,"early") || sessAvail(ds,"late"));
const curMonth = () => D.months.find(m => m.month === state.month);
function defaultStart(opts, session){
  const main = toMin(S[session].main);
  return opts.includes(main) ? main : opts.reduce((b,m)=> Math.abs(m-main) < Math.abs(b-main) ? m : b, opts[0]);
}

/* ---------- 載入 ---------- */
async function boot(){
  try{
    const r = await fetch(API); D = await r.json();
    if(!D.ok) throw new Error(D.error || "載入失敗");
    S = D.settings;
    if(D.liff && D.liff.booking && window.liff){
      await liff.init({ liffId: D.liff.booking });
      if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
      liffReady = true;
    }
    $("loading").style.display = "none";
    const withDays = D.months.find(m => m.openDays.some(d => dayAvail(dateStr(m.month,d))));
    if(!D.months.length){ renderHero(null); $("closed").style.display = ""; return; }
    selectMonth((withDays || D.months[0]).month);
    $("main").style.display = "";
  }catch(err){
    $("loading").textContent = "載入失敗：" + err.message + "，請稍後重新整理。";
  }
}

function selectMonth(month){
  state.month = month; state.day = null; state.session = null; state.start = null;
  const M = curMonth();
  renderHero(M);
  $("mtabs").innerHTML = D.months.length > 1 ? D.months.map(m =>
    `<button type="button" class="mtab${m.month===month?" sel":""}" data-m="${m.month}">${Number(m.month.slice(5))}月</button>`).join("") : "";
  $("mtabs").querySelectorAll("button").forEach(b => b.onclick = () => selectMonth(b.dataset.m));
  const promo = $("promo");
  promo.style.display = (M.tag || M.items || M.plans.length) ? "" : "none";
  promo.innerHTML = (M.tag ? `<span class="tag">${esc(M.tag)}</span>` : "") +
    (M.items ? `<div class="items">${esc(M.items)}</div>` : "") +
    M.plans.map(p => `<div class="row"><span>${esc(p.name)}</span><span class="price">$${Number(p.price).toLocaleString()}${p.was ? `<s>$${Number(p.was).toLocaleString()}</s>` : ""}</span></div>`).join("");
  $("notes").textContent = M.notes || "";
  $("advHint").textContent = `需提前 ${S.minAdvanceDays} 天預約，下面是目前還能約的日子。`;
  $("depositNote").textContent = `送出後麥會先確認工作室，再用 LINE 跟你收定金 $${S.deposit.toLocaleString()}（施作當日折抵）`;
  $("nextDeposit").textContent = `收到回覆後預付定金 $${S.deposit.toLocaleString()}（施作當日折抵）`;
  $("agreeSmall").textContent = `包含定金 $${S.deposit.toLocaleString()}，以及取消或改期的規定`;
  const first = M.openDays.map(d => dateStr(M.month,d)).find(dayAvail);
  if(first) pick(first); else renderAll();
}

function renderHero(M){
  const h = $("hero");
  if(M && M.headerUrl){ h.innerHTML = `<h1 class="poster"><img src="${esc(M.headerUrl)}" alt="Maimine Studio ${Number(M.month.slice(5))}月預約時段"></h1>`; return; }
  const mm = M ? Number(M.month.slice(5)) : "";
  h.innerHTML = `<h1 class="logo"><img src="${LOGO}" alt="Maimine Studio" width="463" height="252"></h1>` +
    (M ? `<p class="mtitle">${mm}月預約時段</p>` : "");
}

/* ---------- 畫面 ---------- */
function renderDays(){
  const M = curMonth(), box = $("days"); box.innerHTML = "";
  const days = M.openDays.map(d => dateStr(M.month,d)).filter(dayAvail);
  if(!days.length){ box.innerHTML = `<div class="placeholder" style="grid-column:1/-1">這個月已經約滿囉，下個月的時段公布後再來看看</div>`; return; }
  days.forEach(ds => {
    const b = document.createElement("button"); b.type = "button";
    b.className = "dbtn" + (state.day===ds ? " sel" : "");
    b.setAttribute("aria-pressed", state.day===ds);
    b.innerHTML = `<span class="d">${Number(ds.slice(5,7))}/${Number(ds.slice(8))}</span><span class="w">週${wdOf(ds)}</span>`;
    b.onclick = () => pick(ds);
    box.appendChild(b);
  });
}

function pick(ds){
  state.day = ds;
  const s = sessAvail(ds,"early") ? "early" : "late";
  state.session = s;
  state.start = defaultStart(startOptions(ds,s), s);
  syncLoc();
  renderAll();
}
function syncLoc(){
  const other = (D.booked[state.day]||{})[state.session==="early"?"late":"early"];
  if(other) state.loc = other.loc;
  else if(!S.locations.includes(state.loc)) state.loc = S.defaultLoc;
}

function renderTimes(){
  const box = $("times");
  if(!state.day){ box.innerHTML = `<div class="placeholder">先選一個日期</div>`; return; }
  box.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "opts";
  ["early","late"].filter(s => sessAvail(state.day,s)).forEach(s => {
    startOptions(state.day,s).forEach(m => {
      const on = state.session===s && state.start===m;
      const o = document.createElement("button"); o.type = "button"; o.className = "opt" + (on?" sel":"");
      o.textContent = toStr(m); o.setAttribute("aria-pressed", on);
      o.onclick = () => { state.session = s; state.start = m; syncLoc(); renderAll(); };
      wrap.appendChild(o);
    });
  });
  box.appendChild(wrap);
}

function renderLocs(){
  const box = $("locs");
  if(!state.day){ box.innerHTML = `<div class="placeholder">選好時間後再選地點</div>`; return; }
  const other = (D.booked[state.day]||{})[state.session==="early"?"late":"early"];
  const list = other ? [other.loc] : S.locations;
  box.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "opts";
  list.forEach(l => {
    const o = document.createElement("button"); o.type = "button"; o.className = "opt zh" + (l===state.loc?" sel":"");
    o.innerHTML = esc(l) + (!other && l===S.defaultLoc ? "<small>主要地點</small>" : "");
    o.setAttribute("aria-pressed", l===state.loc);
    o.onclick = () => { state.loc = l; renderAll(); };
    wrap.appendChild(o);
  });
  box.appendChild(wrap);
  const n = document.createElement("p"); n.className = "hint"; n.style.marginTop = "10px";
  n.textContent = "工作室地址會在預約成立後傳給你。工作室採預約制，無法提前進場，準時抵達就可以囉！";
  box.appendChild(n);
}

function renderSvc(){
  const M = curMonth(), box = $("svc"); box.innerHTML = "";
  S.services.forEach(v => {
    const o = document.createElement("button"); o.type = "button"; o.className = "opt zh" + (state.svc===v?" sel":"");
    o.textContent = v; o.setAttribute("aria-pressed", state.svc===v);
    o.onclick = () => { state.svc = v; if(v==="補色") state.plan = null; renderAll(); };
    box.appendChild(o);
  });
  $("planWrap").style.display = (state.svc==="補色" || !M.plans.length) ? "none" : "";
  const pb = $("plan"); pb.innerHTML = "";
  M.plans.forEach((p,i) => {
    const o = document.createElement("button"); o.type = "button"; o.className = "opt zh" + (state.plan===i?" sel":"");
    o.innerHTML = `${esc(p.name)}<small>$${Number(p.price).toLocaleString()}${p.was ? `（原價 $${Number(p.was).toLocaleString()}）` : ""}</small>`;
    o.setAttribute("aria-pressed", state.plan===i);
    o.onclick = () => { state.plan = i; renderAll(); };
    pb.appendChild(o);
  });
  const pl = $("priceLine");
  if(state.svc==="補色") pl.textContent = "補色價格由麥確認後告知";
  else if(state.plan!==null && M.plans[state.plan]){
    const p = M.plans[state.plan];
    pl.innerHTML = `活動價 <b>$${Number(p.price).toLocaleString()}</b>，定金 $${S.deposit.toLocaleString()} 當日折抵，現場再付 <b>$${(p.price-S.deposit).toLocaleString()}</b>`;
  } else pl.textContent = state.svc==="現場決定" ? "項目可以到現場再決定，方案先選一個就好" : "";
}

function renderAll(){ renderDays(); renderTimes(); renderLocs(); renderSvc(); }

/* ---------- 送出 ---------- */
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const M = curMonth();
  let ok = true, first = null;
  const fail = (id,msg,el) => { $(id).textContent = msg; if(msg){ ok = false; first = first || el; } };
  ["e-name","e-phone","e-check","e-submit"].forEach(id => $(id).textContent = "");
  if(!state.day){ ok = false; first = first || $("days"); }
  const needPlan = state.svc && state.svc!=="補色" && M.plans.length;
  if(!state.svc || (needPlan && state.plan===null)){ ok = false; $("priceLine").innerHTML = `<span style="color:var(--danger)">請選擇預約項目${state.svc && needPlan ? "和方案" : ""}</span>`; first = first || $("svc"); }
  const name = $("name").value.trim(), phone = $("phone").value.replace(/[\s-]/g,"");
  fail("e-name", name ? "" : "請填寫姓名", $("name"));
  fail("e-phone", /^09\d{8}$/.test(phone) ? "" : "請填寫 09 開頭的 10 碼手機號碼", $("phone"));
  if(!$("c-health").checked || !$("c-agree").checked) fail("e-check","請確認兩個項目都勾選後再送出", $("c-health"));
  if(!ok){ first && first.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  if(!liffReady){ $("e-submit").textContent = "請從 LINE 打開這個頁面再預約喔！"; return; }

  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "送出中…";
  try{
    const res = await fetch(API, { method:"POST", body: JSON.stringify({
      action:"book", idToken: liff.getIDToken(), date: state.day, session: state.session, start: toStr(state.start),
      loc: state.loc, service: state.svc, plan: state.plan, name, phone, memo: $("memo").value
    })});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || "送出失敗");
    const b = j.booking;
    const planTxt = b.plan ? "・" + b.plan.replace("　"," ") : "";
    $("summary").innerHTML = `
      <dt>日期</dt><dd>${fmtDate(b.date)}</dd>
      <dt>時間</dt><dd>${esc(b.start)} 開始</dd>
      <dt>地點</dt><dd>${esc(b.loc)}</dd>
      <dt>項目</dt><dd>${esc(b.service)}${esc(planTxt)}</dd>
      <dt>姓名</dt><dd>${esc(b.name)}</dd>
      <dt>手機</dt><dd>${esc(b.phone)}</dd>`;
    $("sheet").classList.add("show"); $("closeSheet").focus();
    (D.booked[b.date] = D.booked[b.date] || {})[state.session] = { t: b.start, loc: b.loc };
    if(liff.isInClient()){
      liff.sendMessages([{ type:"text", text:`我送出了預約申請\n日期：${fmtDate(b.date)}\n時間：${b.start}\n地點：${b.loc}\n項目：${b.service}${planTxt}` }]).catch(()=>{});
    }
  }catch(err){
    $("e-submit").textContent = err.message;
    if(/約走/.test(err.message)){ try{ const r = await fetch(API); const d2 = await r.json(); if(d2.ok){ D.booked = d2.booked; pick(state.day); } }catch(_){} }
  }finally{ btn.disabled = false; btn.textContent = "送出預約申請"; }
});

$("closeSheet").onclick = () => {
  $("sheet").classList.remove("show");
  if(liffReady && liff.isInClient()){ liff.closeWindow(); return; }
  Object.assign(state, { svc:null, plan:null });
  $("f").reset(); selectMonth(state.month); window.scrollTo({ top:0, behavior:"smooth" });
};

boot();
</script>
</body>
</html>
